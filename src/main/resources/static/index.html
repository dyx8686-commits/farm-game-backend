<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game - Login</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:white;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

input, select {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:#4CAF50;
    border:none;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>🌴 Farm Game</h2>

<input id="name" placeholder="Введите имя">

<select id="type">
    <option value="FARMER">FARMER</option>
    <option value="WOODCUTTER">WOODCUTTER</option>
    <option value="MINER">MINER</option>
</select>

<button onclick="register()">Играть</button>

</div>

<script>

const BASE_URL = "https://farm-game-backend-eo4y.onrender.com";

async function register() {

    const name = document.getElementById("name").value;
    const type = document.getElementById("type").value;

    // 🧪 ДИАГНОСТИКА (ОЧЕНЬ ВАЖНО)
    console.log("SELECTED TYPE =", type);

    if (!name) {
        alert("Введите имя!");
        return;
    }

    const url = `${BASE_URL}/game/player?name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`;

    console.log("REQUEST URL =", url);

    const response = await fetch(url);

const text = await response.text();

console.log("RAW RESPONSE =", text);

if (!text || text.trim() === "") {
    alert("Empty server response");
    return;
}

let player;

try {
    player = JSON.parse(text);
} catch (e) {
    console.error("JSON ERROR", e);
    alert("Invalid JSON from server");
    return;
}

console.log("SERVER RESPONSE =", player);

window.location.href =
    "/game.html?name=" + encodeURIComponent(player.name);

</script>

</body>
</html>
