<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Game</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(#87CEEB, #4CAF50);
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: white;
            padding-top: 20px;
        }

        .game {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .island {
            width: 900px;
            height: 500px;
            background: #6dbf4b;
            border-radius: 40px;
            position: relative;
            border: 8px solid #4e8f35;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        .panel {
            position: absolute;
            top: 20px;
            left: 20px;

            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 15px;
        }

        .farm {
            position: absolute;
            bottom: 80px;
            left: 120px;

            width: 140px;
            height: 140px;

            background: #c58b45;
            border: 5px solid #8b5a2b;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .farm:hover {
            transform: scale(1.05);
        }

        .tree {
            position: absolute;
            top: 140px;
            right: 180px;

            width: 100px;
            height: 100px;

            background: #2e8b57;
            border-radius: 50%;
        }

        .tree::after {
            content: '';
            position: absolute;

            width: 20px;
            height: 60px;

            background: #6b3e26;

            left: 40px;
            top: 80px;
        }

        .mine {
            position: absolute;
            bottom: 60px;
            right: 120px;

            width: 140px;
            height: 100px;

            background: gray;
            border-radius: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

    </style>
</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

    <div class="island">

        <div class="panel">

            <h2>Игрок</h2>

            <p id="playerName">Имя: нет</p>
            <p id="playerType">Класс: нет</p>

            <h3>Ресурсы</h3>

            <p id="food">FOOD: 0</p>
            <p id="wood">WOOD: 0</p>
            <p id="ore">ORE: 0</p>

            <button onclick="createFarmer()">FARMER</button>
            <button onclick="createWoodcutter()">WOODCUTTER</button>
            <button onclick="createMiner()">MINER</button>

        </div>

        <!-- FARMER ISLAND -->
        <div id="farmerIsland">
            <div class="farm" onclick="farmClick()"></div>
        </div>

        <!-- WOODCUTTER ISLAND -->
        <div id="woodIsland" style="display:none;">
            <div class="tree"></div>
        </div>

        <!-- MINER ISLAND -->
        <div id="minerIsland" style="display:none;">
            <div class="mine"></div>
        </div>

    </div>

</div>

<script>

    let currentPlayer = null;

    const BASE_URL = "https://farm-game-backend-eo4y.onrender.com";

    // ---------------- CLICK FARM ----------------

    async function farmClick() {

        await fetch(BASE_URL + "/game/tick");

        updatePlayer();
    }

    async function nextTick() {

        await fetch(BASE_URL + "/game/tick");

        updatePlayer();
    }

    // ---------------- CREATE PLAYER ----------------

    async function createFarmer() {
        await createPlayerByType("FARMER");
        showFarmerIsland();
    }

    async function createWoodcutter() {
        await createPlayerByType("WOODCUTTER");
        showWoodIsland();
    }

    async function createMiner() {
        await createPlayerByType("MINER");
        showMinerIsland();
    }

    async function createPlayerByType(type) {

        const response = await fetch(
            BASE_URL + "/game/player?name=Alex&type=" + type
        );

        const player = await response.json();

        currentPlayer = player;

        updateUI(player);
    }

    // ---------------- UPDATE UI ----------------

    async function updatePlayer() {

        const response = await fetch(BASE_URL + "/game/players");

        const players = await response.json();

        const player = players[0];

        updateUI(player);
    }

    function updateUI(player) {

        document.getElementById("playerName").innerText =
            "Имя: " + player.name;

        document.getElementById("playerType").innerText =
            "Класс: " + player.type;

        document.getElementById("food").innerText =
            "FOOD: " + player.resources.FOOD;

        document.getElementById("wood").innerText =
            "WOOD: " + player.resources.WOOD;

        document.getElementById("ore").innerText =
            "ORE: " + player.resources.ORE;
    }

    // ---------------- ISLAND SWITCH ----------------

    function showFarmerIsland() {
        document.getElementById("farmerIsland").style.display = "block";
        document.getElementById("woodIsland").style.display = "none";
        document.getElementById("minerIsland").style.display = "none";
    }

    function showWoodIsland() {
        document.getElementById("farmerIsland").style.display = "none";
        document.getElementById("woodIsland").style.display = "block";
        document.getElementById("minerIsland").style.display = "none";
    }

    function showMinerIsland() {
        document.getElementById("farmerIsland").style.display = "none";
        document.getElementById("woodIsland").style.display = "none";
        document.getElementById("minerIsland").style.display = "block";
    }

</script>

</body>
</html>
