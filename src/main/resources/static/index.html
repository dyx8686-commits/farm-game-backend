<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game - Login</title>

<style>

body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box {
    background:white;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

input, select {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:#4CAF50;
    border:none;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

    <h2>🌴 Farm Game</h2>

    <input id="name" placeholder="Введите имя">

    <select id="type">
        <option value="FARMER">FARMER</option>
        <option value="WOODCUTTER">WOODCUTTER</option>
        <option value="MINER">MINER</option>
    </select>

    <button onclick="register()">Играть</button>

</div>

<script>

const BASE_URL =
    "https://farm-game-backend-production.up.railway.app";

async function register() {

    console.log("REGISTER START");

    const name = document.getElementById("name").value;
    const type = document.getElementById("type").value;

    if (!name) {
        alert("Введите имя!");
        return;
    }

    const url =
        `${BASE_URL}/game/player?name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`;

    console.log("REQUEST URL =", url);

    try {

        // НЕ ломаемся если backend кривой
        const response = await fetch(url, {
            method: "GET"
        }).catch(err => {
            console.log("FETCH ERROR (ignored):", err);
            return null;
        });

        if (response) {
            console.log("STATUS =", response.status);

            const text = await response.text().catch(() => "");

            console.log("RAW RESPONSE =", text);
        }

        // 🔥 ВСЕГДА ПЕРЕХОДИМ В ИГРУ
        window.location.href =
            "/game.html?name=" + encodeURIComponent(name);

    } catch (e) {
        console.error("REGISTER ERROR =", e);

        // даже если всё упало — всё равно запускаем игру
        window.location.href =
            "/game.html?name=" + encodeURIComponent(name);
    }
}

</script>

</body>
</html>
