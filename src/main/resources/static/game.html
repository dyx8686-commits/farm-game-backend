<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
}

.farmerIsland { background: #6dbf4b; }
.woodIsland { background: #2f6b2f; }
.minerIsland { background: #777; }

.panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    width: 240px;
}

button {
    width: 100%;
    margin-top: 5px;
    padding: 8px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
}

button:hover {
    background: #45a049;
}

.farm, .tree, .mine {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.farm {
    bottom: 80px;
    left: 120px;
    width: 120px;
    height: 120px;
    background: #c58b45;
}

.tree {
    top: 150px;
    right: 180px;
    width: 100px;
    height: 100px;
    background: #2e8b57;
}

.mine {
    bottom: 80px;
    right: 120px;
    width: 140px;
    height: 100px;
    background: #555;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
    cursor: pointer;
}

.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* ===== SHOP ===== */

#shopModal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.shop-box {
    width: 420px;
    margin: 80px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.item img {
    width: 60px;
    height: 60px;
}

.item button {
    margin-top: 5px;
    font-size: 12px;
}

</style>

</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">

        <div id="info">Loading...</div>

        <button onclick="plant()">🌱 Plant</button>
        <button onclick="harvest()">🌾 Harvest</button>

        <button onclick="openShop()">🏪 Open Shop</button>

    </div>

    <div id="farmerObjects">
        <div class="farm" onclick="tick()"></div>
        <div class="shop" onclick="openShop()"></div>
        <div id="fields"></div>
    </div>

</div>

</div>

<!-- ================= SHOP ================= -->

<div id="shopModal">
    <div class="shop-box">

        <h2>🏪 Shop</h2>

        <div class="shop-grid">

            <div class="item">
                <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png">
                <div>Seeds</div>
                <button onclick="buySeeds()">Buy (5 FOOD)</button>
            </div>

            <div class="item">
                <img src="https://cdn-icons-png.flaticon.com/512/415/415682.png">
                <div>Wood</div>
                <button onclick="sellWood()">Sell</button>
            </div>

            <div class="item">
                <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png">
                <div>Ore</div>
                <button onclick="sellOre()">Sell</button>
            </div>

            <div class="item">
                <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
                <div>Food</div>
                <button onclick="sellFood()">Sell</button>
            </div>

        </div>

        <br>
        <button onclick="closeShop()">❌ Close</button>

    </div>
</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

// ===== LOAD =====

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    const r = player.resources || {};

    document.getElementById("info").innerHTML = `
        <b>${player.name}</b><br>
        Class: ${player.type}<br><br>

        FOOD: ${r.FOOD ?? 0}<br>
        WOOD: ${r.WOOD ?? 0}<br>
        ORE: ${r.ORE ?? 0}<br>
        GOLD: ${r.GOLD ?? 0}<br><br>

        SEEDS: ${player.seeds ?? 0}
    `;

    renderFields(player);
}

// ===== SHOP =====

function openShop() {
    document.getElementById("shopModal").style.display = "block";
}

function closeShop() {
    document.getElementById("shopModal").style.display = "none";
}

// ===== ACTIONS =====

async function plant() {
    await fetch(BASE + "/game/plant?name=" + playerName);
    load();
}

async function harvest() {
    await fetch(BASE + "/game/harvest?name=" + playerName);
    load();
}

async function tick() {
    await fetch(BASE + "/game/tick");
    load();
}

async function buySeeds() {
    await fetch(BASE + "/game/shop/seeds?name=" + playerName + "&amount=1");
    load();
}

async function sellWood() {
    await fetch(BASE + "/game/sell/wood?name=" + playerName + "&amount=10", {method:"POST"});
    load();
}

async function sellOre() {
    await fetch(BASE + "/game/sell/ore?name=" + playerName + "&amount=5", {method:"POST"});
    load();
}

async function sellFood() {
    await fetch(BASE + "/game/sell/food?name=" + playerName + "&amount=5", {method:"POST"});
    load();
}

// ===== FIELDS =====

function renderFields(player) {

    const container = document.getElementById("fields");
    container.innerHTML = "";

    if (!player.fields) return;

    player.fields.forEach((f, i) => {

        const div = document.createElement("div");
        div.className = "field";

        div.style.left = (300 + i * 50) + "px";
        div.style.bottom = "120px";

        if (f.ready) div.style.background = "#FFD700";
        else if (f.planted) div.style.background = "#8B5A2B";
        else div.style.background = "#3CB371";

        container.appendChild(div);
    });
}

// ===== START =====

setInterval(load, 3000);
load();

</script>

</body>
</html>
