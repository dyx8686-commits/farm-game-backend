<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;

    margin: 60px auto;

    position: relative;

    border: 6px solid #3e7d2f;
    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        #6dbf4b;

    background-size: 60px 60px;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
    #inventory {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
}

.slot {
    width: 70px;
    height: 70px;

    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    font-family: Arial;
}

.slot.selected {
    border: 2px solid yellow;
}

.slot-count {
    font-size: 12px;
}
</style>
</head>

<body>
<div id="shopWindow" style="
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:300px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:15px;
    border-radius:10px;
    display:none;
    z-index:999;
">

    <h3>🏪 Shop</h3>

    <button id="buySeedBtn">Buy Seed (3💰)</button>
    <button id="sellBtn">Sell Wheat (5💰)</button>

    <br><br>
    <button onclick="toggleShop()">Close</button>

    <div id="shopInfo"></div>

</div>

    <div id="island"></div>
<div id="inventory"></div>
    
<script>

/* ================= BIOMES ================= */

const BIOMES = {
    FARM: "FARM",
    WOOD: "WOOD",
    MINE: "MINE"
};

let currentBiome = BIOMES.FARM;

/* ================= INVENTORY ================= */

const inventory = {
    WHEAT_SEED: 10,
    WHEAT: 0,

    WOOD_SEED: 0,
    WOOD: 0,

    GOLD: 100
};

let selectedSlot = "WHEAT_SEED";

/* ================= WORLD ================= */

const island = document.getElementById("island");
const GRID_SIZE = 60;

const plots = new Map();

/* ================= SHOP ================= */
console.log("SHOP INIT");
function toggleShop() {
    const el = document.getElementById("shopWindow");
    if (!el) return;

    el.style.display = el.style.display === "block" ? "none" : "block";
}

/* ================= BUILDINGS ================= */

function createShopBuilding(x, y) {

    const shop = document.createElement("div");

    shop.style.position = "absolute";
    shop.style.left = x + "px";
    shop.style.top = y + "px";

    shop.style.width = "60px";
    shop.style.height = "60px";

    shop.style.display = "flex";
    shop.style.alignItems = "center";
    shop.style.justifyContent = "center";

    shop.style.fontSize = "42px";
    shop.style.cursor = "pointer";

    shop.innerHTML = "🏪";

    shop.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleShop();
    });

    island.appendChild(shop);
}

/* ================= WORLD GENERATION ================= */

function generateWorld() {

    island.innerHTML = "";
    plots.clear();

    createShopBuilding(400, 220);

    if (currentBiome === BIOMES.FARM) {
        console.log("FARM BIOME");
    }

    if (currentBiome === BIOMES.WOOD) {
        console.log("WOOD BIOME");
    }

    if (currentBiome === BIOMES.MINE) {
        console.log("MINE BIOME");
    }
}

/* ================= PLANTS ================= */

function createPlantVisual(x, y, stage, type) {

    const el = document.createElement("div");

    el.style.position = "absolute";
    el.style.width = "28px";
    el.style.height = "28px";
    el.style.borderRadius = "50%";

    el.style.left = (x + 16) + "px";
    el.style.top = (y + 16) + "px";
    el.style.zIndex = "10";

    /* FARM PLANTS */
    if (type === "WHEAT") {
        if (stage === 0) el.style.background = "#2ecc71";
        if (stage === 1) el.style.background = "#27ae60";
        if (stage === 2) el.style.background = "#145a32";
    }

    /* WOOD PLANTS */
    if (type === "WOOD") {
        if (stage === 0) el.style.background = "#8d6e63";
        if (stage === 1) el.style.background = "#6d4c41";
        if (stage === 2) el.style.background = "#4e342e";
    }

    return el;
}

/* ================= CLICK SYSTEM ================= */

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    const key = x + ":" + y;

    /* ONLY FARM ALLOWS PLANTS */
    if (currentBiome !== BIOMES.FARM) return;

    if (!plots.has(key)) {

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(key, {
            plantEl: null,
            stage: -1,
            type: null
        });

        return;
    }

    const cell = plots.get(key);

    /* PLANT */
    if (cell.stage === -1) {

        const seed = selectedSlot;

        if (!seed.includes("_SEED")) return;
        if (inventory[seed] <= 0) return;

        inventory[seed]--;

        const type = seed.replace("_SEED", "");

        const plant = createPlantVisual(x, y, 0, type);

        island.appendChild(plant);

        cell.plantEl = plant;
        cell.stage = 0;
        cell.type = type;

        startGrowth(key);

        renderInventory();
        return;
    }

    /* HARVEST */
    if (cell.stage === 2) {

        const type = cell.type;

        if (type === "WHEAT") inventory.WHEAT++;
        if (type === "WOOD") inventory.WOOD++;

        cell.plantEl.remove();

        cell.plantEl = null;
        cell.stage = -1;
        cell.type = null;

        renderInventory();
    }
});

/* ================= GROWTH ================= */

function startGrowth(key) {
    setTimeout(() => growStep(key), 3000);
}

function growStep(key) {

    const cell = plots.get(key);
    if (!cell || !cell.plantEl) return;

    cell.stage++;

    const x = parseInt(key.split(":")[0]);
    const y = parseInt(key.split(":")[1]);

    const newPlant = createPlantVisual(x, y, cell.stage, cell.type);

    cell.plantEl.remove();
    cell.plantEl = newPlant;

    island.appendChild(newPlant);

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}

/* ================= INVENTORY ================= */

function renderInventory() {

    const el = document.getElementById("inventory");
    if (!el) return;

    el.innerHTML = `
        <div class="slot ${selectedSlot === 'WHEAT_SEED' ? 'selected' : ''}">
            🌱 ${inventory.WHEAT_SEED}
        </div>

        <div class="slot ${selectedSlot === 'WHEAT' ? 'selected' : ''}">
            🌾 ${inventory.WHEAT}
        </div>

        <div class="slot ${selectedSlot === 'WOOD' ? 'selected' : ''}">
            🪵 ${inventory.WOOD}
        </div>

        <div class="slot">
            💰 ${inventory.GOLD}
        </div>
    `;
}

    function initShop() {

    const buyBtn = document.getElementById("buySeedBtn");
    const sellBtn = document.getElementById("sellBtn");

    if (buyBtn) {
        buyBtn.addEventListener("click", () => {

            if (inventory.GOLD < 3) return;

            inventory.GOLD -= 3;
            inventory.WHEAT_SEED += 1;

            renderInventory();
        });
    }

    if (sellBtn) {
        sellBtn.addEventListener("click", () => {

            if (inventory.WHEAT <= 0) return;

            inventory.WHEAT -= 1;
            inventory.GOLD += 5;

            renderInventory();
        });
    }
}

/* ================= INPUT ================= */

document.addEventListener("keydown", (e) => {

    /* HOTBAR */
    if (e.key === "1") selectedSlot = "WHEAT_SEED";
    if (e.key === "2") selectedSlot = "WHEAT";
    if (e.key === "3") selectedSlot = "WOOD";

    /* BIOMES */
    if (e.key === "f") currentBiome = BIOMES.FARM;
    if (e.key === "g") currentBiome = BIOMES.WOOD;
    if (e.key === "h") currentBiome = BIOMES.MINE;

    generateWorld();
    renderInventory();
});

/* ================= START ================= */

window.addEventListener("load", () => {
    generateWorld();
    renderInventory();
    initShop();
});
    
/* ================= SAFETY FIX ================= */

function safeGet(id) {
    return document.getElementById(id);
}


</script>
</body>
</html>
