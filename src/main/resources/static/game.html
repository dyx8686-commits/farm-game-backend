<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
    background: #6dbf4b;
}

/* OBJECTS */
.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
}

/* FIELD */
.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* INVENTORY */
.inventory {
    position: fixed;
    top: 80px;
    right: 20px;
    width: 320px;
    background: #c6c6c6;
    padding: 12px;
    border: 4px solid #555;
    border-radius: 8px;
    display: none;
    z-index: 1000;
}

/* GRID */
.inventory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

/* SLOT */
.inv-item {
    width: 65px;
    height: 65px;
    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 6px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    font-size: 14px;
    color: white;

    position: relative;
}

/* HOVER */
.inv-item:hover {
    background: #999;
}

/* SELECTED */
.selected {
    border: 3px solid yellow !important;
}
/* ===== SHOP GRID ===== */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.shop-item {

    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 8px;

    padding: 10px;

    text-align: center;

    cursor: pointer;

    color: white;

    transition: 0.2s;
}

.shop-item:hover {
    background: #999;
    transform: scale(1.03);
}

.shop-icon {
    font-size: 32px;
}

.shop-price {
    margin-top: 5px;
    font-size: 13px;
    color: gold;
}

/* ITEM COUNT */
.inv-count {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 12px;
    color: white;
    font-weight: bold;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* WORLD OBJECTS */
.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }

</style>
</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">
        <div id="info">Loading...</div>
    </div>

    <button id="inventoryBtn" onclick="openInventory()">
    🎒 Inventory
</button>

<div class="inventory" id="inventory" style="display:none;"></div>

    <div id="farmerObjects">

        <div class="shop" onclick="openShop()"></div>

        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>

    </div>

</div>

</div>

<!-- SHOP -->
<div id="shopModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
">

    <div style="
    width:400px;
    background:white;
    margin:100px auto;
    padding:20px;
    border-radius:12px;
    ">

        <div id="shopContent"></div>

        <button onclick="closeShop()">Close</button>
    </div>
</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

let selectedItem = null;

// ================= LOAD =================

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    const inv = player.inventory || {};

document.getElementById("info").innerHTML = `
    <b>${player.name}</b><br>
    CLASS: ${player.type}<br><br>

    FOOD: ${inv.FOOD ?? 0}<br>
    WOOD: ${inv.WOOD ?? 0}<br>
    ORE: ${inv.ORE ?? 0}<br>
    GOLD: ${inv.GOLD ?? 0}<br>
    SEEDS: ${inv.SEEDS ?? 0}<br>
    SAPLING: ${inv.SAPLING ?? 0}<br>
`;

    renderInventory(inv);
    renderWorld(player);
    updatePlayer();
}

// ================= WORLD =================

function renderWorld(player) {

    document.getElementById("farmerPlants").innerHTML = "";
    document.getElementById("woodTrees").innerHTML = "";
    document.getElementById("minerStones").innerHTML = "";

    if (player.type === "FARMER") renderPlants(player);
    if (player.type === "WOODCUTTER") renderTrees(player);
    if (player.type === "MINER") renderStones(player);
}

// 🌱 FARMER
    let fieldState = Array.from({ length: 6 }, () => ({
    stage: "EMPTY",
    timer: 0
}));
function renderPlants() {

    const c = document.getElementById("farmerPlants");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const state = fieldState[i];

        const d = document.createElement("div");

        d.className = "field";

        d.style.left = (240 + (i % 3) * 70) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 70) + "px";

        // 🌱 ПУСТО
        if (state.stage === "EMPTY") {

            d.style.background = "#8B5A2B";
            d.innerText = "+";

            d.onclick = () => plantSeed(i);
        }

        // 🌱 СЕМЯ
        if (state.stage === "SEED") {

            d.style.background = "#A0522D";
            d.innerText = "🌱";

            setTimeout(() => {
                fieldState[i].stage = "GROWING";
                renderPlants();
            }, 5000); // быстрое прорастание
        }

        // 🌿 РАСТЁТ
        if (state.stage === "GROWING") {

            d.style.background = "#7CFC00";
            d.innerText = "🌿";

            setTimeout(() => {
                fieldState[i].stage = "READY";
                renderPlants();
            }, 10000); // рост
        }

        // 🌾 ГОТОВО
        if (state.stage === "READY") {

            d.style.background = "#FFD700";
            d.innerText = "🌾";

            d.onclick = async () => {

                await fetch(BASE + "/game/harvest?name=" + playerName);

                fieldState[i] = {
                    stage: "EMPTY",
                    timer: 0
                };

                renderPlants();
                load();
            };
        }

        c.appendChild(d);
    }

}

// 🌲 WOODCUTTER
let treeState = Array(6).fill({
    stage: "EMPTY", // EMPTY | SAPLING | TREE
    timer: 0
});

function renderTrees() {

    const c = document.getElementById("woodTrees");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const state = treeState[i];

        const d = document.createElement("div");

        // 🌱 ПУСТОЕ МЕСТО
        if (state.stage === "EMPTY") {
            continue;
        }

        // 🌱 САЖЕНЕЦ
        if (state.stage === "SAPLING") {
            d.className = "treeObj";
            d.style.background = "#8B4513";

            d.innerText = "🌱";

            setTimeout(() => {
                treeState[i].stage = "TREE";
                renderTrees();
            }, 10000); // 10 сек рост
        }

        // 🌳 ДЕРЕВО
        if (state.stage === "TREE") {
            d.className = "treeObj";
            d.style.background = "#2e8b57";
            d.innerText = "🌳";

            d.onclick = async () => {

                await fetch(BASE + "/game/wood?name=" + playerName, {
                    method: "POST"
                });

                // 💥 срубили → теперь пусто
                treeState[i] = {
                    stage: "EMPTY",
                    timer: 0
                };

                renderTrees();
                load();
            };
        }

        d.style.position = "absolute";
        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (140 + Math.floor(i / 3) * 100) + "px";

        c.appendChild(d);
    }
    if (state.stage === "EMPTY") {

    d.className = "treeObj";
    d.style.background = "#5a3d1a";
    d.innerText = "+";

    d.onclick = () => plantTree(i);
}
}

// ⛏ MINER
    let stoneState = Array(6).fill(true);
function renderStones() {

    const c = document.getElementById("minerStones");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        if (!stoneState[i]) continue;

        const d = document.createElement("div");

        d.className = "stoneObj";

        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 90) + "px";

        d.onclick = async () => {

            await fetch(BASE + "/game/mine?name=" + playerName, {
                method: "POST"
            });

            stoneState[i] = false; // 💥 шахта истощается

            renderStones();
            load();
        };

        c.appendChild(d);
    }
}
// ================= INVENTORY =================

function renderInventory(inv) {

    const inventory = document.getElementById("inventory");

    const items = [
        { name: "FOOD", icon: "🍞" },
        { name: "WOOD", icon: "🪵" },
        { name: "ORE", icon: "⛏" },
        { name: "GOLD", icon: "💰" },

        { name: "WHEAT_SEEDS", icon: "🌾" },
        { name: "CORN_SEEDS", icon: "🌽" },
        { name: "POTATO_SEEDS", icon: "🥔" },

        { name: "OAK_SAPLING", icon: "🌳" },
        { name: "PINE_SAPLING", icon: "🌲" },

        { name: "COPPER_ORE", icon: "🟤" },
        { name: "IRON_ORE", icon: "⚙️" },
        { name: "GOLD_ORE_BOX", icon: "📦" }
    ];

    inventory.innerHTML = `<div class="inventory-grid"></div>`;

    const grid = inventory.querySelector(".inventory-grid");

    items.forEach(i => {

        const amount = inv[i.name] ?? 0;

        if (amount <= 0) return;

        const div = document.createElement("div");

        div.className = "inv-item";

        if (selectedItem === i.name) {
            div.classList.add("selected");
        }

        div.innerHTML = `
            <div>${i.icon}</div>
            <div class="inv-count">${amount}</div>
        `;

        div.onclick = () => {

            selectedItem =
                selectedItem === i.name ? null : i.name;

            load();
        };

        grid.appendChild(div);
    });
}

// ================= PLAYER =================

function updatePlayer() {
    const p = document.getElementById("player");
    p.style.left = "420px";
    p.style.top = "260px";
}

// ================= SHOP =================

async function openShop() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);

    if (!player) return;

    let shopItems = [];

    // 🌾 FARMER
    if (player.type === "FARMER") {

        shopItems = [

            {
                item: "SEEDS",
                icon: "🌾",
                price: 5
            },

            {
                item: "CARROT",
                icon: "🥕",
                price: 8
            },

            {
                item: "WHEAT",
                icon: "🌽",
                price: 10
            }
        ];
    }

    // 🌲 WOODCUTTER
    if (player.type === "WOODCUTTER") {

        shopItems = [

            {
                item: "SAPLING",
                icon: "🌳",
                price: 12
            },

            {
                item: "OAK_LOG",
                icon: "🪵",
                price: 15
            }
        ];
    }

    // ⛏ MINER
    if (player.type === "MINER") {

        shopItems = [

            {
                item: "ORE_BOX",
                icon: "📦",
                price: 20
            },

            {
                item: "IRON_ORE",
                icon: "⛓️",
                price: 25
            }
        ];
    }

    document.getElementById("shopContent").innerHTML = `

        <div class="shop-grid">

            ${shopItems.map(i => `

                <div class="shop-item"
                     onclick="buyItem('${i.item}')">

                    <div class="shop-icon">
                        ${i.icon}
                    </div>

                    <div>
                        ${i.item}
                    </div>

                    <div class="shop-price">
                        💰 ${i.price}
                    </div>

                </div>

            `).join("")}

        </div>
    `;

    document.getElementById("shopModal").style.display = "block";
}

// ================= BUY =================

async function buyItem(item) {

    await fetch(
        BASE + "/game/shop/buy?name=" + playerName + "&item=" + item + "&amount=1",
        {
            method: "POST"
        }
    );

    load();
}

// ===== CLOSE SHOP =====

function closeShop() {

    document.getElementById("shopModal").style.display = "none";

}
    function openInventory() {

    const inv = document.getElementById("inventory");

    if (inv.style.display === "none") {
        inv.style.display = "block";
    } else {
        inv.style.display = "none";
    }
function useItemOnWorld(target) {

    if (!selectedItem) {
        alert("Выбери предмет в инвентаре");
        return;
    }

    // FARM
    if (target === "FIELD") {

        if (selectedItem !== "SEEDS") {
            alert("На поле можно использовать только семена");
            return;
        }

        fetch(BASE + "/game/plant?name=" + playerName, {
            method: "POST"
        }).then(load);
    }

    // WOOD
    if (target === "TREE") {

        if (selectedItem !== "SAPLING") {
            alert("На дереве можно использовать только саженец");
            return;
        }

        fetch(BASE + "/game/wood?name=" + playerName, {
            method: "POST"
        }).then(load);
    }

    // MINE
    if (target === "STONE") {

        if (selectedItem !== "ORE_BOX") {
            alert("На шахте нужна коробка для руды");
            return;
        }

        fetch(BASE + "/game/mine?name=" + playerName, {
            method: "POST"
        }).then(load);
    }
   function plantTree(index) {

    if (selectedItem !== "SAPLING") {
        alert("Выбери саженец");
        return;
    }

    if (treeState[index].stage !== "EMPTY") {
        alert("Тут уже что-то есть");
        return;
    }

    treeState[index] = {
        stage: "SAPLING",
        timer: Date.now()
    };

    load();
    renderTrees();
}
}

// ================= LOOP =================

setInterval(load, 3000);
load();

</script>

</body>
</html>
