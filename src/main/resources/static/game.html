<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
</style>
</head>

<body>

<div id="island"></div>

<script>
const island = document.getElementById("island");

const GRID_SIZE = 60;

const plots = new Map(); // key -> {el, plant}

// создание грядок
island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    const gx = Math.floor(x / GRID_SIZE) * GRID_SIZE;
    const gy = Math.floor(y / GRID_SIZE) * GRID_SIZE;

    const key = gx + ":" + gy;

    // если грядки нет → создаём
    if (!plots.has(key)) {

        const plot = document.createElement("div");
        plot.className = "plot";
        plot.style.left = gx + "px";
        plot.style.top = gy + "px";

        island.appendChild(plot);

        plots.set(key, { el: plot, plant: null });
        return;
    }

    // если грядка есть → сажаем растение
    const cell = plots.get(key);

    if (cell.plant) return; // уже занято

    const plant = document.createElement("div");
    plant.style.position = "absolute";
    plant.style.width = "30px";
    plant.style.height = "30px";
    plant.style.background = "green";
    plant.style.borderRadius = "50%";
    plant.style.left = gx + 15 + "px";
    plant.style.top = gy + 15 + "px";

    island.appendChild(plant);

    cell.plant = plant;
});
</script>

</body>
</html>
