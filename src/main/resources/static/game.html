<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
    background: #6dbf4b;
}

/* OBJECTS */
.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
}

/* FIELD */
.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* INVENTORY */
.inventory {
    position: fixed;
    top: 80px;
    right: 20px;
    width: 320px;
    background: #c6c6c6;
    padding: 12px;
    border: 4px solid #555;
    border-radius: 8px;
    display: none;
    z-index: 1000;
}

/* GRID */
.inventory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

/* SLOT */
.inv-item {
    width: 65px;
    height: 65px;
    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 6px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    font-size: 14px;
    color: white;

    position: relative;
}

/* HOVER */
.inv-item:hover {
    background: #999;
}

/* SELECTED */
.selected {
    border: 3px solid yellow !important;
}
/* ===== SHOP GRID ===== */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.shop-item {

    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 8px;

    padding: 10px;

    text-align: center;

    cursor: pointer;

    color: white;

    transition: 0.2s;
}

.shop-item:hover {
    background: #999;
    transform: scale(1.03);
}

.shop-icon {
    font-size: 32px;
}

.shop-price {
    margin-top: 5px;
    font-size: 13px;
    color: gold;
}

/* ITEM COUNT */
.inv-count {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 12px;
    color: white;
    font-weight: bold;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* WORLD OBJECTS */
.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }
    body.farm {
    background: linear-gradient(#87CEEB, #4CAF50);
}

body.wood {
    background: linear-gradient(#1f3d1f, #0f1f0f);
}

body.mine {
    background: linear-gradient(#666, #222);
}

</style>
</head>

<body id="gameBody">

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">
        <div id="info">Loading...</div>
    </div>

    <button id="inventoryBtn" onclick="openInventory()">
    🎒 Inventory
</button>

<div class="inventory" id="inventory" style="display:none;"></div>

    <div id="farmerObjects">

        <div class="shop" onclick="openShop()"></div>

        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>

    </div>

</div>

</div>

<!-- SHOP -->
<div id="shopModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
">

    <div style="
    width:400px;
    background:white;
    margin:100px auto;
    padding:20px;
    border-radius:12px;
    ">

        <div id="shopContent"></div>

        <button onclick="closeShop()">Close</button>
    </div>
</div>

<script src="/js/core.js"></script>

<script src="/js/world_farm.js"></script>
<script src="/js/world_wood.js"></script>
<script src="/js/world_mine.js"></script>

<script src="/js/inventory.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
