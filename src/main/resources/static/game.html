<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
    #inventory {
    position: absolute;
    top: 10px;
    left: 10px;

    background: rgba(0,0,0,0.5);
    color: white;

    padding: 10px;
    border-radius: 10px;

    font-family: Arial;
    z-index: 100;
}
</style>
</head>

<body>

<div id="island"></div>
<div id="inventory"></div>
<div id="shop" style="
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
    color:white;
    z-index:200;
">
    <div>🛒 SHOP</div>

    <button id="buySeedBtn">Buy Wheat Seed (1 = 3 gold)</button>
    <button id="sellBtn">Sell Wheat (1 = 5 gold)</button>

    <div id="shopInfo"></div>
</div>

<script>
const inventory = {
    WHEAT_SEED: 0,
    WHEAT: 0,
    GOLD: 0
};

const island = document.getElementById("island");
const GRID_SIZE = 60;

const plots = new Map();

/*
state:
-1 = empty
0 = planted
1 = grow
2 = ready
*/

function createPlantVisual(x, y, stage) {
    const el = document.createElement("div");

    el.style.position = "absolute";
    el.style.width = "28px";
    el.style.height = "28px";
    el.style.borderRadius = "50%";
    el.style.left = (x + 16) + "px";
    el.style.top = (y + 16) + "px";
    el.style.zIndex = "10";

    if (stage === 0) el.style.background = "#2ecc71";
    if (stage === 1) el.style.background = "#27ae60";
    if (stage === 2) el.style.background = "#145a32";

    return el;
}

// ================= CLICK =================

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    const key = x + ":" + y;

    if (!plots.has(key)) {

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(key, {
            plotEl,
            plantEl: null,
            stage: -1
        });

        return;
    }

    const cell = plots.get(key);

    // PLANT
    if (cell.stage === -1) {

    if (inventory.WHEAT_SEED <= 0) {
        alert("No seeds!");
        return;
    }

    inventory.WHEAT_SEED -= 1;

    const plant = createPlantVisual(x, y, 0);

    island.appendChild(plant);

    cell.plantEl = plant;
    cell.stage = 0;

    startGrowth(key);

    renderInventory();
    renderShop();

    return;
}

    // HARVEST
    if (cell.stage === 2) {

    cell.plantEl.remove();

    cell.plantEl = null;
    cell.stage = -1;

    inventory.WHEAT += 1;

    renderInventory();
    renderShop();

    return;
}
});

// ================= GROWTH =================

function startGrowth(key) {
    setTimeout(() => growStep(key), 3000);
}

function growStep(key) {

    const cell = plots.get(key);
    if (!cell || !cell.plantEl) return;

    cell.stage++;

    const x = parseInt(key.split(":")[0]);
    const y = parseInt(key.split(":")[1]);

    const newPlant = createPlantVisual(x, y, cell.stage);

    cell.plantEl.remove();
    cell.plantEl = newPlant;

    island.appendChild(newPlant);

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}

// ================= INVENTORY =================

function renderInventory() {

    const el = document.getElementById("inventory");
    if (!el) return;

    el.innerHTML = `
        🌱 Seeds: ${inventory.WHEAT_SEED}<br>
        🌾 Wheat: ${inventory.WHEAT}<br>
        💰 Gold: ${inventory.GOLD}
    `;
}

// ================= SHOP =================

function renderShop() {

    const el = document.getElementById("shopInfo");
    if (!el) return;

    el.innerHTML = `
        🌾 Wheat: ${inventory.WHEAT}<br>
        💰 Gold: ${inventory.GOLD}
    `;
}

// ================= SELL BUTTON (SAFE INIT) =================

function initShop() {

    const sellBtn = document.getElementById("sellBtn");
    const buyBtn = document.getElementById("buySeedBtn");

    if (sellBtn) {
        sellBtn.addEventListener("click", () => {

            if (inventory.WHEAT <= 0) {
                alert("No wheat!");
                return;
            }

            inventory.WHEAT -= 1;
            inventory.GOLD += 5;

            console.log("SOLD 1 WHEAT");

            renderInventory();
            renderShop();
        });
    }

    if (buyBtn) {
        buyBtn.addEventListener("click", () => {

            if (inventory.GOLD < 3) {
                alert("Not enough gold!");
                return;
            }

            inventory.GOLD -= 3;
            inventory.WHEAT_SEED += 1;

            console.log("BOUGHT SEED", inventory);

            renderInventory();
            renderShop();
        });
    }
}

// ================= START =================

window.addEventListener("load", () => {
    renderInventory();
    renderShop();
    initShop();
});
</script>
</body>
</html>
