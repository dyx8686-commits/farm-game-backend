<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ВИЗУАЛ КЛИКА */
.click {
    position: absolute;
    width: 10px;
    height: 10px;
    background: yellow;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}
</style>
</head>

<body>

<div id="island"></div>

<script>
const island = document.getElementById("island");

island.addEventListener("click", (e) => {
    const rect = island.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const dot = document.createElement("div");
    dot.className = "click";
    dot.style.left = x + "px";
    dot.style.top = y + "px";

    island.appendChild(dot);

    setTimeout(() => dot.remove(), 300);
});
</script>

</body>
</html>
