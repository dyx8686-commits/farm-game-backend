<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
</style>
</head>

<body>

<div id="island"></div>

<script>
const island = document.getElementById("island");

const GRID_SIZE = 60;

// грядки + растения
const plots = new Map();

/*
key = "x:y"
value = {
    plotEl,
    plantEl
}
*/

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    const key = x + ":" + y;

    // ================= CREATE PLOT =================
    if (!plots.has(key)) {

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(key, {
            plotEl: plotEl,
            plantEl: null
        });

        return;
    }

    // ================= PLANT =================
    const cell = plots.get(key);

    if (cell.plantEl) return;

    const plantEl = document.createElement("div");

    plantEl.style.position = "absolute";
    plantEl.style.width = "28px";
    plantEl.style.height = "28px";
    plantEl.style.background = "#2ecc71";
    plantEl.style.border = "2px solid #145a32";
    plantEl.style.borderRadius = "50%";

    plantEl.style.left = (x + 16) + "px";
    plantEl.style.top = (y + 16) + "px";

    plantEl.style.zIndex = "10";

    island.appendChild(plantEl);

    cell.plantEl = plantEl;

    console.log("PLANT CREATED AT", key);
});
</script>

</body>
</html>
