<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial;
    background: #4fc3f7;
}

#island {
    position: relative;
    width: 900px;
    height: 500px;
    margin: auto;
    margin-top: 40px;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
}

#plots {
    position: absolute;
    width: 100%;
    height: 100%;
}

.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139,69,19,0.9);
    border: 1px solid #000;
}

#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    left: 420px;
    top: 260px;
}

#hotbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
}

.hotbar-slot {
    width: 50px;
    height: 50px;
    background: #333;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
</head>

<body>

<div id="island">
    <div id="plots"></div>
    <div id="player"></div>
</div>

<div id="hotbar"></div>

<script src="/js/core.js"></script>

</body>
</html>
