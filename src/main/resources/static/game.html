<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;

    margin: 60px auto;

    position: relative;

    border: 6px solid #3e7d2f;
    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        #6dbf4b;

    background-size: 60px 60px;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
    #inventory {
    position: absolute;

    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    background: rgba(0,0,0,0.4);

    padding: 12px;
    border-radius: 16px;

    z-index: 500;
}

.slot {
    width: 70px;
    height: 70px;

    background: rgba(255,255,255,0.15);

    border: 3px solid rgba(255,255,255,0.2);
    border-radius: 12px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    font-family: Arial;

    position: relative;
}

.slot.selected {
    border: 3px solid gold;
    transform: scale(1.05);
}

.slot-count {
    position: absolute;
    bottom: 4px;
    right: 6px;

    font-size: 14px;
}
</style>
</head>

<body>

<div id="island"></div>
<div id="inventory"></div>
<div id="shop" style="
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
    color:white;
    z-index:200;
">
    <div>🛒 SHOP</div>

    <button id="buySeedBtn">Buy Wheat Seed (1 = 3 gold)</button>
    <button id="sellBtn">Sell Wheat (1 = 5 gold)</button>

    <div id="shopInfo"></div>
</div>

<script>
const inventory = {
    WHEAT_SEED: 0,
    WHEAT: 0,
    GOLD: 0
};

const island = document.getElementById("island");
const GRID_SIZE = 60;

const plots = new Map();
    let selectedSlot = "WHEAT_SEED";

/*
state:
-1 = empty
0 = planted
1 = grow
2 = ready
*/

function createPlantVisual(x, y, stage) {
    const el = document.createElement("div");

    el.style.position = "absolute";
    el.style.width = "28px";
    el.style.height = "28px";
    el.style.borderRadius = "50%";
    el.style.left = (x + 16) + "px";
    el.style.top = (y + 16) + "px";
    el.style.zIndex = "10";

    if (stage === 0) el.style.background = "#2ecc71";
    if (stage === 1) el.style.background = "#27ae60";
    if (stage === 2) el.style.background = "#145a32";

    return el;
}

// ================= CLICK =================

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    const key = x + ":" + y;

    if (!plots.has(key)) {

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(key, {
            plotEl,
            plantEl: null,
            stage: -1
        });

        return;
    }

    const cell = plots.get(key);

    // PLANT
    if (cell.stage === -1) {

    if (inventory.WHEAT_SEED <= 0) {
        alert("No seeds!");
        return;
    }

    inventory.WHEAT_SEED -= 1;

    const plant = createPlantVisual(x, y, 0);

    island.appendChild(plant);

    cell.plantEl = plant;
    cell.stage = 0;

    startGrowth(key);

    renderInventory();
    renderShop();

    return;
}

    // HARVEST
    if (cell.stage === 2) {

    cell.plantEl.remove();

    cell.plantEl = null;
    cell.stage = -1;

    inventory.WHEAT += 1;

    renderInventory();
    renderShop();

    return;
}
});

// ================= GROWTH =================

function startGrowth(key) {
    setTimeout(() => growStep(key), 3000);
}

function growStep(key) {

    const cell = plots.get(key);
    if (!cell || !cell.plantEl) return;

    cell.stage++;

    const x = parseInt(key.split(":")[0]);
    const y = parseInt(key.split(":")[1]);

    const newPlant = createPlantVisual(x, y, cell.stage);

    cell.plantEl.remove();
    cell.plantEl = newPlant;

    island.appendChild(newPlant);

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}

// ================= INVENTORY =================

function renderInventory() {

    const el = document.getElementById("inventory");

    el.innerHTML = `
        <div class="slot ${selectedSlot === 'WHEAT_SEED' ? 'selected' : ''}">
            🌱
            <div>Seeds</div>
            <div class="slot-count">${inventory.WHEAT_SEED}</div>
        </div>

        <div class="slot">
            🌾
            <div>Wheat</div>
            <div class="slot-count">${inventory.WHEAT}</div>
        </div>

        <div class="slot">
            💰
            <div>Gold</div>
            <div class="slot-count">${inventory.GOLD}</div>
        </div>
    `;
}
// ================= SHOP =================

function renderShop() {

    const el = document.getElementById("shopInfo");
    if (!el) return;

    el.innerHTML = `
        🌾 Wheat: ${inventory.WHEAT}<br>
        💰 Gold: ${inventory.GOLD}
    `;
}

// ================= SELL BUTTON (SAFE INIT) =================

function initShop() {

    const sellBtn = document.getElementById("sellBtn");
    const buyBtn = document.getElementById("buySeedBtn");

    if (sellBtn) {
        sellBtn.addEventListener("click", () => {

            if (inventory.WHEAT <= 0) {
                alert("No wheat!");
                return;
            }

            inventory.WHEAT -= 1;
            inventory.GOLD += 5;

            console.log("SOLD 1 WHEAT");

            renderInventory();
            renderShop();
        });
    }

    if (buyBtn) {
        buyBtn.addEventListener("click", () => {

            if (inventory.GOLD < 3) {
                alert("Not enough gold!");
                return;
            }

            inventory.GOLD -= 3;
            inventory.WHEAT_SEED += 1;

            console.log("BOUGHT SEED", inventory);

            renderInventory();
            renderShop();
        });
    }
}

// ================= START =================
    
document.addEventListener("keydown", (e) => {

    if (e.key === "1") {
        selectedSlot = "WHEAT_SEED";
        renderInventory();
    }

});
window.addEventListener("load", () => {
    renderInventory();
    renderShop();
    initShop();
});
</script>
</body>
</html>
