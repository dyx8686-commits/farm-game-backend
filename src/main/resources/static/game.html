<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
}

.farmerIsland { background: #6dbf4b; }
.woodIsland { background: #2f6b2f; }
.minerIsland { background: #777; }

.panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    width: 240px;
}

button {
    width: 100%;
    margin-top: 5px;
    padding: 8px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
}

button:hover {
    background: #45a049;
}

.farm, .tree, .mine {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.farm {
    bottom: 80px;
    left: 120px;
    width: 120px;
    height: 120px;
    background: #c58b45;
}

.tree {
    top: 150px;
    right: 180px;
    width: 100px;
    height: 100px;
    background: #2e8b57;
}

.mine {
    bottom: 80px;
    right: 120px;
    width: 140px;
    height: 100px;
    background: #555;
}

.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

</style>

</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">

        <div id="info">Loading...</div>

        <button onclick="plant()">🌱 Plant</button>
        <button onclick="harvest()">🌾 Harvest</button>
        <button onclick="buySeeds()">🛒 Buy seeds</button>

        <button onclick="sellWood()">💰 Sell wood</button>
        <button onclick="sellOre()">💰 Sell ore</button>

        <button onclick="goNpcIsland()">🏪 NPC Island</button>

    </div>

    <div id="farmerObjects">
        <div class="farm" onclick="tick()"></div>
        <div id="fields"></div>
    </div>

    <div id="woodObjects" style="display:none;">
        <div class="tree" onclick="chopWood()"></div>
    </div>

    <div id="minerObjects" style="display:none;">
        <div class="mine" onclick="mineOre()"></div>
    </div>

</div>

</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

// ================= LOAD =================

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);

    if (!player) return;

    const resObj = player.resources || {};

    document.getElementById("info").innerHTML = `
        <b>${player.name}</b><br>
        Class: ${player.type}<br><br>

        FOOD: ${resObj.FOOD ?? 0}<br>
        WOOD: ${resObj.WOOD ?? 0}<br>
        ORE: ${resObj.ORE ?? 0}<br><br>

        SEEDS: ${player.seeds ?? 0}<br>
        GOLD: ${resObj.GOLD ?? 0}<br>
    `;

    renderFields(player);
    changeIsland(player.type);
}

// ================= ISLAND =================

function changeIsland(type) {

    const island = document.getElementById("island");

    island.classList.remove("farmerIsland","woodIsland","minerIsland");

    document.getElementById("farmerObjects").style.display = "none";
    document.getElementById("woodObjects").style.display = "none";
    document.getElementById("minerObjects").style.display = "none";

    if (type === "FARMER") {
        island.classList.add("farmerIsland");
        document.getElementById("farmerObjects").style.display = "block";
    }

    if (type === "WOODCUTTER") {
        island.classList.add("woodIsland");
        document.getElementById("woodObjects").style.display = "block";
    }

    if (type === "MINER") {
        island.classList.add("minerIsland");
        document.getElementById("minerObjects").style.display = "block";
    }
}

// ================= ACTIONS =================

async function tick() {
    await fetch(BASE + "/game/tick");
    load();
}

async function plant() {
    await fetch(BASE + "/game/plant?name=" + playerName);
    load();
}

async function harvest() {
    await fetch(BASE + "/game/harvest?name=" + playerName);
    load();
}

async function buySeeds() {
    await fetch(BASE + "/game/shop/seeds?name=" + playerName + "&amount=1");
    load();
}

async function sellWood() {
    await fetch(BASE + "/game/sell/wood?name=" + playerName + "&amount=10", { method: "POST" });
    load();
}

async function sellOre() {
    await fetch(BASE + "/game/sell/ore?name=" + playerName + "&amount=5", { method: "POST" });
    load();
}

async function chopWood() {
    await fetch(BASE + "/game/wood?name=" + playerName, { method: "POST" });
    load();
}

async function mineOre() {
    await fetch(BASE + "/game/mine?name=" + playerName, { method: "POST" });
    load();
}

function goNpcIsland() {
    window.location.href = "npc.html?name=" + playerName;
}

// ================= FIELDS =================

function renderFields(player) {

    const container = document.getElementById("fields");
    container.innerHTML = "";

    if (!player.fields) return;

    player.fields.forEach((f, i) => {

        const div = document.createElement("div");

        div.className = "field";
        div.style.left = (300 + i * 50) + "px";
        div.style.bottom = "120px";

        if (f.planted) div.style.background = "#8B5A2B";
        else if (f.ready) div.style.background = "#FFD700";
        else div.style.background = "#3CB371";

        container.appendChild(div);
    });
}

// ================= START =================

setInterval(load, 3000);
load();

</script>

</body>
</html>
