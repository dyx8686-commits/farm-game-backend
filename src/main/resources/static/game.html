<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
}

.farmerIsland { background: #6dbf4b; }
.woodIsland { background: #2f6b2f; }
.minerIsland { background: #777; }

.panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    width: 240px;
}

button {
    width: 100%;
    margin-top: 5px;
    padding: 8px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
}

button:hover {
    background: #45a049;
}

/* ===== OBJECTS ===== */

.farm, .treeObj, .stoneObj, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.farm {
    bottom: 80px;
    left: 120px;
    width: 120px;
    height: 120px;
    background: #c58b45;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* ===== PLAYER ===== */

#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
    box-shadow: 0 0 10px rgba(255,0,0,0.6);
}

/* ===== FIELD ===== */

.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* ===== INVENTORY ===== */

.inventory {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 180px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* ===== GENERATED OBJECTS ===== */

.treeObj {
    width: 40px;
    height: 40px;
    background: #2e8b57;
}

.stoneObj {
    width: 40px;
    height: 40px;
    background: #666;
}

.plantObj {
    width: 40px;
    height: 40px;
    background: #3CB371;
}

</style>
</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">

        <div id="info">Loading...</div>

        <button onclick="plant()">🌱 Plant</button>
        <button onclick="harvest()">🌾 Harvest</button>
        <button onclick="openShop()">🏪 Shop</button>

    </div>

    <div class="inventory" id="inventory"></div>

    <div id="farmerObjects">
        <div class="farm"></div>
        <div class="shop" onclick="openShop()"></div>

        <div id="fields"></div>
        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>
    </div>

</div>

</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

let selectedItem = null;

// ================= LOAD =================

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    const r = player.resources || {};

    document.getElementById("info").innerHTML = `
        <b>${player.name}</b><br>
        Class: ${player.type}<br><br>

        FOOD: ${r.FOOD ?? 0}<br>
        WOOD: ${r.WOOD ?? 0}<br>
        ORE: ${r.ORE ?? 0}<br>
        GOLD: ${r.GOLD ?? 0}<br>
        SEEDS: ${player.seeds ?? 0}
    `;

    renderInventory(r);
    renderFields(player);
    renderWorld();
    updatePlayerPosition();
}

// ================= WORLD =================

function renderWorld() {

    renderPlants();
    renderTrees();
    renderStones();
}

// 🌱 FARMER (6 грядок)

function renderPlants() {

    const c = document.getElementById("farmerPlants");
    if (!c) return;

    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");
        d.className = "plantObj";

        d.style.left = (200 + (i % 3) * 60) + "px";
        d.style.top = (220 + Math.floor(i / 3) * 60) + "px";

        c.appendChild(d);
    }
}

// 🌲 WOODCUTTER (6 деревьев)

function renderTrees() {

    const c = document.getElementById("woodTrees");
    if (!c) return;

    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");
        d.className = "treeObj";

        d.style.left = (140 + (i % 3) * 80) + "px";
        d.style.top = (120 + Math.floor(i / 3) * 90) + "px";

        c.appendChild(d);
    }
}

// ⛏ MINER (6 камней)

function renderStones() {

    const c = document.getElementById("minerStones");
    if (!c) return;

    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");
        d.className = "stoneObj";

        d.style.left = (140 + (i % 3) * 80) + "px";
        d.style.top = (200 + Math.floor(i / 3) * 80) + "px";

        c.appendChild(d);
    }
}

// ================= PLAYER =================

function updatePlayerPosition() {
    const p = document.getElementById("player");
    if (!p) return;

    p.style.left = "420px";
    p.style.top = "260px";
}

// ================= INVENTORY =================

function renderInventory(r) {

    const inv = document.getElementById("inventory");

    const items = [
        {name:"FOOD", icon:"🍞"},
        {name:"WOOD", icon:"🪵"},
        {name:"ORE", icon:"⛏"},
        {name:"GOLD", icon:"💰"},
        {name:"SEEDS", icon:"🌾"}
    ];

    inv.innerHTML = "";

    items.forEach(i => {

        const d = document.createElement("div");
        d.className = "inv-item";

        if (selectedItem === i.name) d.classList.add("selected");

        d.innerHTML = `${i.icon} ${i.name}: ${r[i.name] ?? 0}`;

        d.onclick = () => {
            selectedItem = i.name;
            load();
        };

        inv.appendChild(d);
    });
}

// ================= ACTIONS =================

async function plant() {
    await fetch(BASE + "/game/plant?name=" + playerName);
    load();
}

async function harvest() {
    await fetch(BASE + "/game/harvest?name=" + playerName);
    load();
}

// ================= FIELDS =================

function renderFields(player) {

    const c = document.getElementById("fields");
    c.innerHTML = "";

    if (!player.fields) return;

    player.fields.forEach((f, i) => {

        const d = document.createElement("div");
        d.className = "field";

        d.style.left = (300 + i * 50) + "px";
        d.style.bottom = "120px";

        if (f.ready) d.style.background = "#FFD700";
        else if (f.planted) d.style.background = "#8B5A2B";
        else d.style.background = "#3CB371";

        c.appendChild(d);
    });
}

// ================= LOOP =================

setInterval(load, 3000);
load();

</script>

</body>
</html>
