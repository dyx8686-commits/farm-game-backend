<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

/* ================= BASE ================= */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial;
}

body {
    background: #4fc3f7;
}

/* ================= WORLD ================= */

.world {
    width: 100vw;
    height: 100vh;
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= GAME WRAPPER ================= */

.game {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= ISLAND (MAIN SCENE) ================= */
#island {
    position: relative;
}

    .island {
    width: 900px;
    height: 500px;

    position: relative;
    overflow: hidden;

    border-radius: 40px;
    border: 8px solid #4e8f35;

    background: #6dbf4b;

    z-index: 2;
}
    

/* ================= GRID (BACKGROUND LAYER) ================= */

.grid-cell {
    width: 60px;
    height: 60px;

    border: 1px solid rgba(255,255,255,0.08);

    box-sizing: border-box;

    background: transparent; /* ❗ ВАЖНО */
}
/* ================= PLOTS ================= */

#plots {
    position: absolute;
    width: 900px;
    height: 600px;
}

.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: #7c4a1e;
    border: 1px solid rgba(0,0,0,0.2);
    box-sizing: border-box;
}
/* ================= PLAYER ================= */

#player {
    position: absolute;
    width: 30px;
    height: 30px;

    background: red;
    border-radius: 6px;

    left: 420px;
    top: 260px;

    z-index: 10;
}

/* ================= OBJECTS ================= */

.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

/* SHOP (IMPORTANT FIXED LAYER) */

.shop {
    position: absolute;
    top: 220px;
    left: 200px;

    width: 90px;
    height: 90px;

    background: gold;
    border-radius: 12px;

    cursor: pointer;

    z-index: 15;
}

/* ================= WORLD OBJECTS ================= */

.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }

/* ================= THEME BACKGROUNDS ================= */

body.farm {
    background: linear-gradient(#87CEEB, #4CAF50);
}

body.wood {
    background: linear-gradient(#1f3d1f, #0f1f0f);
}

body.mine {
    background: linear-gradient(#666, #222);
}

/* ================= INVENTORY ================= */

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.inv-item {
    width: 65px;
    height: 65px;

    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 6px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    color: white;
    font-size: 14px;
}

.inv-item:hover {
    background: #999;
}

.inv-count {
    position: absolute;
    bottom: 4px;
    right: 6px;

    font-size: 12px;
    color: white;
}

/* ================= SHOP GRID ================= */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.shop-item {
    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 8px;

    padding: 10px;
    text-align: center;

    cursor: pointer;
    color: white;

    transition: 0.2s;
}

.shop-item:hover {
    transform: scale(1.03);
    background: #999;
}

.shop-icon {
    font-size: 32px;
}

.shop-price {
    margin-top: 5px;
    font-size: 13px;
    color: gold;
}

/* ================= MODALS ================= */

.shop-modal {
    display: none;
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.6);
    z-index: 1000;
}

.shop-window {
    width: 520px;
    margin: 80px auto;

    background: #2c2c2c;
    padding: 15px;
    border-radius: 14px;

    color: white;
}

/* ================= SELECTED ================= */

.selected {
    border: 3px solid yellow !important;
}
    #hotbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 6px;
    z-index: 9999;
}

.hotbar-slot {
    width: 50px;
    height: 50px;

    background: rgba(0,0,0,0.5);
    border: 2px solid #444;
    border-radius: 6px;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    font-size: 12px;

    cursor: pointer;
}

.hotbar-slot.active {
    border: 2px solid yellow;
}

</style>
</head>

<body>

<div id="game">
    <div id="island">

        <div id="ui">
            <button onclick="openInventory()">🎒 Inventory</button>
            <button onclick="openShop()">🛒 Shop</button>
        </div>

        <!-- ЕДИНСТВЕННАЯ ЗЕМЛЯ -->
        <div id="plots"></div>

        <!-- ОБЪЕКТЫ -->
        <div id="entities">
            <div id="player"></div>
            <div id="plants"></div>
        </div>

    </div>
</div>

<!-- UI -->
<div id="inventoryModal"></div>
<div id="shopModal"></div>

<!-- SCRIPTS -->
<script src="/js/core.js"></script>
<script src="/js/world.js"></script>
<script src="/js/ui.js"></script>

</body>
</html>
