<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

/* ОСТРОВ */
#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ИГРОК */
#player {
    width: 30px;
    height: 30px;
    background: red;
    position: absolute;

    top: 220px;
    left: 420px;
}
</style>
</head>

<body>

<div id="island">
    <div id="player"></div>
</div>

</body>
</html>
