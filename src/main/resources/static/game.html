<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
    background: #6dbf4b;
}

/* OBJECTS */
.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
}

/* FIELD */
.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* INVENTORY */
.inventory {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 180px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* WORLD OBJECTS */
.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }

</style>
</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">
        <div id="info">Loading...</div>
    </div>

    <div class="inventory" id="inventory"></div>

    <div id="farmerObjects">

        <div class="shop" onclick="openShop()"></div>

        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>

    </div>

</div>

</div>

<!-- SHOP -->
<div id="shopModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
">

    <div style="
    width:400px;
    background:white;
    margin:100px auto;
    padding:20px;
    border-radius:12px;
    ">

        <div id="shopContent"></div>

        <button onclick="closeShop()">Close</button>
    </div>
</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

let selectedItem = null;

// ================= LOAD =================

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    const inv = player.inventory || {};

document.getElementById("info").innerHTML = `
    <b>${player.name}</b><br>
    CLASS: ${player.type}<br><br>

    FOOD: ${inv.FOOD ?? 0}<br>
    WOOD: ${inv.WOOD ?? 0}<br>
    ORE: ${inv.ORE ?? 0}<br>
    GOLD: ${inv.GOLD ?? 0}<br>
    SEEDS: ${inv.SEEDS ?? 0}<br>
    SAPLING: ${inv.SAPLING ?? 0}<br>
`;

    renderInventory(inv);
    renderWorld(player);
    updatePlayer();
}

// ================= WORLD =================

function renderWorld(player) {

    document.getElementById("farmerPlants").innerHTML = "";
    document.getElementById("woodTrees").innerHTML = "";
    document.getElementById("minerStones").innerHTML = "";

    if (player.type === "FARMER") renderPlants(player);
    if (player.type === "WOODCUTTER") renderTrees(player);
    if (player.type === "MINER") renderStones(player);
}

// 🌱 FARMER
function renderPlants(player) {

    const c = document.getElementById("farmerPlants");

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "field";

        d.style.left = (240 + (i % 3) * 70) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 70) + "px";

        d.style.background = "#8B5A2B";

        d.onclick = async () => {

            if (selectedItem !== "SEEDS") {
                alert("Select SEEDS in inventory");
                return;
            }

            await fetch(BASE + "/game/plant?name=" + playerName);

            load();
        };

        c.appendChild(d);
    }
}

// 🌲 WOODCUTTER
function renderTrees() {

    const c = document.getElementById("woodTrees");

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "treeObj";

        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (140 + Math.floor(i / 3) * 100) + "px";

        d.onclick = async () => {

            await fetch(BASE + "/game/wood?name=" + playerName, {
                method: "POST"
            });

            load();
        };

        c.appendChild(d);
    }
}

// ⛏ MINER
function renderStones() {

    const c = document.getElementById("minerStones");

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "stoneObj";

        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 90) + "px";

        d.onclick = async () => {

            await fetch(BASE + "/game/mine?name=" + playerName, {
                method: "POST"
            });

            load();
        };

        c.appendChild(d);
    }
}

// ================= INVENTORY =================

function renderInventory(inv) {

    const inventory = document.getElementById("inventory");

    const items = [
        { name: "FOOD", icon: "🍞" },
        { name: "WOOD", icon: "🪵" },
        { name: "ORE", icon: "⛏" },
        { name: "GOLD", icon: "💰" },
        { name: "SEEDS", icon: "🌾" },
        { name: "SAPLING", icon: "🌱" },
        { name: "ORE_BOX", icon: "📦" }
    ];

    inventory.innerHTML = "";

    items.forEach(i => {

        const div = document.createElement("div");
        div.className = "inv-item";

        if (selectedItem === i.name) {
            div.classList.add("selected");
        }

        div.innerHTML = `${i.icon} ${i.name}: ${inv[i.name] ?? 0}`;

        div.onclick = () => {
            selectedItem = selectedItem === i.name ? null : i.name;
            load();
        };

        inventory.appendChild(div);
    });
}

// ================= PLAYER =================

function updatePlayer() {
    const p = document.getElementById("player");
    p.style.left = "420px";
    p.style.top = "260px";
}

// ================= SHOP =================

async function openShop() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    let shopItems = [];

    if (player.type === "FARMER") {
        shopItems = [
    { name: "Wheat Seeds", item: "WHEAT_SEEDS" },
    { name: "Corn Seeds", item: "CORN_SEEDS" },
    { name: "Potato Seeds", item: "POTATO_SEEDS" }
];
    }

    if (player.type === "WOODCUTTER") {
        shopItems = [
    { name: "Oak Sapling", item: "OAK_SAPLING" },
    { name: "Pine Sapling", item: "PINE_SAPLING" }
];
    }

    if (player.type === "MINER") {
        shopItems = [
    { name: "Copper Ore", item: "COPPER_ORE" },
    { name: "Iron Ore", item: "IRON_ORE" },
    { name: "Gold Ore Box", item: "GOLD_ORE_BOX" }
];
    }

    document.getElementById("shopContent").innerHTML =
        shopItems.map(i => `
            <button onclick="buyItem('${i.item}')">
                Buy ${i.name}
            </button>
        `).join("");

    document.getElementById("shopModal").style.display = "block";
}

// ================= BUY =================

async function buyItem(item) {

    await fetch(
        BASE + "/game/shop/buy?name=" + playerName + "&item=" + item + "&amount=1",
        {
            method: "POST"
        }
    );

    load();
}
    function closeShop() {
    document.getElementById("shopModal").style.display = "none";
}

// ================= LOOP =================

setInterval(load, 3000);
load();

</script>

</body>
</html>
