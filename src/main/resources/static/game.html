<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;
    margin: 60px auto;
    background: #6dbf4b;
    border: 6px solid #3e7d2f;
    border-radius: 20px;
    position: relative;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
</style>
</head>

<body>

<div id="island"></div>

<script>
const island = document.getElementById("island");

const GRID_SIZE = 60;

// хранение занятых клеток
const plots = new Set();

island.addEventListener("click", (e) => {
    const rect = island.getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // привязка к сетке
    x = Math.floor(x / GRID_SIZE) * GRID_SIZE;
    y = Math.floor(y / GRID_SIZE) * GRID_SIZE;

    const key = x + ":" + y;

    // если уже есть — не ставим
    if (plots.has(key)) return;

    plots.add(key);

    const plot = document.createElement("div");
    plot.className = "plot";
    plot.style.left = x + "px";
    plot.style.top = y + "px";

    island.appendChild(plot);
});
</script>

</body>
</html>
