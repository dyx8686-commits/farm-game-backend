<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;

    margin: 60px auto;

    position: relative;

    border: 6px solid #3e7d2f;
    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        #6dbf4b;

    background-size: 60px 60px;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
   #inventory {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    flex-wrap: wrap;
    max-width: 850px;

    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
}

.slot {
    width: 70px;
    height: 70px;

    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    font-family: Arial;
}

.slot.selected {
    border: 2px solid yellow;
}

.slot-count {
    font-size: 12px;
}
</style>
</head>

<body>
<div id="shopWindow" style="
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:300px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:15px;
    border-radius:10px;
    display:none;
    z-index:999;
">
    <div id="invWindow" style="
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:320px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:15px;
    border-radius:10px;
    display:none;
    z-index:999;
">
    <h3>🎒 Full Inventory</h3>
    <div id="invContent"></div>

    <br>
    <button onclick="toggleInventory()">Close</button>
</div>

    <h3>🏪 Shop</h3>

    <button id="buySeedBtn">Buy Seed (3💰)</button>
    <button id="sellBtn">Sell Wheat (5💰)</button>

    <br><br>
    <button onclick="toggleShop()">Close</button>

    <div id="shopInfo"></div>

</div>

    <div id="island"></div>
<div id="inventory"></div>
    
<script>

/* ================= BIOMES ================= */

const BIOMES = {
    FARM: "FARM",
    WOOD: "WOOD",
    MINE: "MINE"
};

let currentBiome = BIOMES.FARM;

/* ================= INVENTORY ================= */
<button id="invBtn" style="
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    padding:10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
">
    🎒 Inventory
</button>
    
const inventory = {

    /* FARM */

    WHEAT_SEED: 5,
CARROT_SEED: 5,
POTATO_SEED: 5,

WHEAT: 0,
CARROT: 0,
POTATO: 0,

    /* WOOD */

    BIRCH_SEED: 3,
    PINE_SEED: 3,
    OAK_SEED: 3,

    BIRCH_WOOD: 0,
    PINE_WOOD: 0,
    OAK_WOOD: 0,

    /* MINE */

    STONE: 0,
    IRON: 0,
    COPPER: 0,

    /* MONEY */

    GOLD: 20
};

let selectedSlot = "WHEAT_SEED";
   let hotbar = [
    "WHEAT_SEED",
    "CARROT_SEED",
    "POTATO_SEED"
];

/* ================= WORLD ================= */

const island = document.getElementById("island");
const GRID_SIZE = 60;

const MAX_PLOTS = 6;
const plots = new Map();

function initPlots() {

    const positions = [
        {x: 0, y: 0},
        {x: 1, y: 0},
        {x: 2, y: 0},
        {x: 0, y: 1},
        {x: 1, y: 1},
        {x: 2, y: 1}
    ];

    positions.forEach((p, i) => {

        const x = p.x * GRID_SIZE;
        const y = p.y * GRID_SIZE;

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(i, {
            x,
            y,
            plantEl: null,
            stage: -1,
            type: null
        });
    });
}

/* ================= SHOP ================= */
function initShop() {

    const buyBtn = document.getElementById("buySeedBtn");
    const sellBtn = document.getElementById("sellBtn");

    if (buyBtn) {
        buyBtn.addEventListener("click", () => {

            if (inventory.GOLD < 3) return;

            inventory.GOLD -= 3;
            inventory.WHEAT_SEED += 1;

            renderInventory();
        });
    }

    if (sellBtn) {
        sellBtn.addEventListener("click", () => {

            if (inventory.WHEAT <= 0) return;

            inventory.WHEAT -= 1;
            inventory.GOLD += 5;

            renderInventory();
        });
    }
}
    console.log("SHOP INIT");
function toggleShop() {
    const el = document.getElementById("shopWindow");
    if (!el) return;

    el.style.display = el.style.display === "block" ? "none" : "block";
}

/* ================= BUILDINGS ================= */

function createShopBuilding(x, y) {

    const shop = document.createElement("div");

    shop.style.position = "absolute";
    shop.style.left = x + "px";
    shop.style.top = y + "px";

    shop.style.width = "60px";
    shop.style.height = "60px";

    shop.style.display = "flex";
    shop.style.alignItems = "center";
    shop.style.justifyContent = "center";

    shop.style.fontSize = "42px";
    shop.style.cursor = "pointer";

    shop.innerHTML = "🏪";

    shop.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleShop();
    });

    island.appendChild(shop);
}

/* ================= WORLD GENERATION ================= */

function generateWorld() {

    island.innerHTML = "";
    plots.clear();

    createShopBuilding(400, 220);

    if (
    currentBiome !== BIOMES.FARM &&
    currentBiome !== BIOMES.WOOD &&
    currentBiome !== BIOMES.MINE
) return;

    if (currentBiome === BIOMES.WOOD) {
        console.log("WOOD BIOME");
    }

    if (currentBiome === BIOMES.MINE) {
        console.log("MINE BIOME");
    }
}

/* ================= PLANTS ================= */

function createPlantVisual(x, y, stage, type) {

    const el = document.createElement("div");

    el.style.position = "absolute";
    el.style.width = "28px";
    el.style.height = "28px";
    el.style.borderRadius = "50%";

    el.style.left = (x + 16) + "px";
    el.style.top = (y + 16) + "px";
    el.style.zIndex = "10";

    /* FARM PLANTS */

if (type === "WHEAT") {
    if (stage === 0) el.style.background = "#2ecc71";
    if (stage === 1) el.style.background = "#27ae60";
    if (stage === 2) el.style.background = "#145a32";
}

if (type === "CARROT") {
    if (stage === 0) el.style.background = "#ffb74d";
    if (stage === 1) el.style.background = "#fb8c00";
    if (stage === 2) el.style.background = "#e65100";
}

if (type === "POTATO") {
    if (stage === 0) el.style.background = "#d7ccc8";
    if (stage === 1) el.style.background = "#a1887f";
    if (stage === 2) el.style.background = "#6d4c41";
}

  
    /* WOOD PLANTS */

if (type === "BIRCH") {
    if (stage === 0) el.style.background = "#d7ccc8";
    if (stage === 1) el.style.background = "#a1887f";
    if (stage === 2) el.style.background = "#6d4c41";
}

if (type === "PINE") {
    if (stage === 0) el.style.background = "#81c784";
    if (stage === 1) el.style.background = "#388e3c";
    if (stage === 2) el.style.background = "#1b5e20";
}

if (type === "OAK") {
    if (stage === 0) el.style.background = "#a1887f";
    if (stage === 1) el.style.background = "#6d4c41";
    if (stage === 2) el.style.background = "#3e2723";
}
    /* MINE ORES */

if (type === "STONE") {
    if (stage === 0) el.style.background = "#9e9e9e";
    if (stage === 1) el.style.background = "#757575";
    if (stage === 2) el.style.background = "#424242";
}

if (type === "IRON") {
    if (stage === 0) el.style.background = "#ffcc80";
    if (stage === 1) el.style.background = "#ffa726";
    if (stage === 2) el.style.background = "#ef6c00";
}

if (type === "COPPER") {
    if (stage === 0) el.style.background = "#ffab91";
    if (stage === 1) el.style.background = "#ff7043";
    if (stage === 2) el.style.background = "#d84315";
}
return el;
}
/* ================= CLICK SYSTEM ================= */

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    let target = null;

    for (const cell of plots.values()) {
        if (cell.x === x && cell.y === y) {
            target = cell;
            break;
        }
    }

    if (!target) return;

    const seed = selectedSlot;

    const isFarm =
        seed.includes("WHEAT") ||
        seed.includes("CARROT") ||
        seed.includes("POTATO");

    const isWood =
        seed.includes("BIRCH") ||
        seed.includes("PINE") ||
        seed.includes("OAK");

    const isMine =
        seed.includes("STONE") ||
        seed.includes("IRON") ||
        seed.includes("COPPER");

    /* ================= PLANT ================= */

    if (target.stage === -1) {

        if (currentBiome === BIOMES.FARM && !isFarm) return;
        if (currentBiome === BIOMES.WOOD && !isWood) return;
        if (currentBiome === BIOMES.MINE && !isMine) return;

        if (!inventory[seed] || inventory[seed] <= 0) return;

        inventory[seed]--;

        const type = seed
            .replace("_SEED", "")
            .replace("PICK_", "");

        const plant = createPlantVisual(x, y, 0, type);

        island.appendChild(plant);

        target.plantEl = plant;
        target.stage = 0;
        target.type = type;

        startGrowth(`${x}:${y}`);

        renderInventory(); // или renderHotbar
        saveWorld();
        return;
    }

    /* ================= HARVEST ================= */

    if (target.stage === 2) {

        const type = target.type;

        if (type === "WHEAT") inventory.WHEAT++;
        if (type === "CARROT") inventory.CARROT++;
        if (type === "POTATO") inventory.POTATO++;

        if (type === "BIRCH") inventory.BIRCH_WOOD++;
        if (type === "PINE") inventory.PINE_WOOD++;
        if (type === "OAK") inventory.OAK_WOOD++;

        if (type === "STONE") inventory.STONE++;
        if (type === "IRON") inventory.IRON++;
        if (type === "COPPER") inventory.COPPER++;

        target.plantEl.remove();

        target.plantEl = null;
        target.stage = -1;
        target.type = null;

        renderInventory(); // или renderHotbar
        saveWorld();
    }
});


/* ================= GROWTH ================= */

function startGrowth(key) {
    setTimeout(() => growStep(key), 3000);
}

function growStep(key) {

    let cell = null;

    for (const plot of plots.values()) {

        if (`${plot.x}:${plot.y}` === key) {
            cell = plot;
            break;
        }
    }

    if (!cell || !cell.plantEl) return;

    cell.stage++;

    const newPlant = createPlantVisual(
        cell.x,
        cell.y,
        cell.stage,
        cell.type
    );

    cell.plantEl.remove();

    cell.plantEl = newPlant;

    island.appendChild(newPlant);
     const newPlant = createPlantVisual(
        cell.x,
        cell.y,
        cell.stage,
        cell.type
    );

    cell.plantEl.remove();

    cell.plantEl = newPlant;
    
    saveWorld();

    island.appendChild(newPlant);

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}
/* ================= INVENTORY ================= */
function toggleInventory() {
    const el = document.getElementById("invWindow");
    if (!el) return;

    el.style.display = el.style.display === "block" ? "none" : "block";

    renderFullInventory();
}

    function renderFullInventory() {

    const el = document.getElementById("invContent");
    if (!el) return;

    el.innerHTML = `
        🌾 Wheat Seeds: ${inventory.WHEAT_SEED}<br>
        🥕 Carrot Seeds: ${inventory.CARROT_SEED}<br>
        🥔 Potato Seeds: ${inventory.POTATO_SEED}<br>
        <br>
        🌾 Wheat: ${inventory.WHEAT}<br>
        🥕 Carrot: ${inventory.CARROT}<br>
        🥔 Potato: ${inventory.POTATO}<br>
        <br>
        🌳 Birch: ${inventory.BIRCH_SEED}<br>
        🌲 Pine: ${inventory.PINE_SEED}<br>
        🌳 Oak: ${inventory.OAK_SEED}<br>
        <br>
        🪵 Birch Wood: ${inventory.BIRCH_WOOD}<br>
        🪵 Pine Wood: ${inventory.PINE_WOOD}<br>
        🪵 Oak Wood: ${inventory.OAK_WOOD}<br>
        <br>
        🪨 Stone: ${inventory.STONE}<br>
        ⛏ Iron: ${inventory.IRON}<br>
        🟠 Copper: ${inventory.COPPER}<br>
        <br>
        💰 Gold: ${inventory.GOLD}
    `;
}
    
function addToHotbar(item) {

    hotbarSlots = hotbarSlots.filter(i => i !== item);

    hotbarSlots.push(item);

    if (hotbarSlots.length > 3) {
        hotbarSlots.shift();
    }
}
function renderInventory() {

    const el = document.getElementById("inventory");
    if (!el) return;

    el.innerHTML = "";

    hotbar.forEach(item => {

        const div = document.createElement("div");

        div.className = "slot";

        if (item === selectedSlot) {
            div.classList.add("selected");
        }

        let text = item;

        if (item === "WHEAT_SEED") {
            text = `🌾 Wheat (${inventory.WHEAT_SEED})`;
        }

        if (item === "CARROT_SEED") {
            text = `🥕 Carrot (${inventory.CARROT_SEED})`;
        }

        if (item === "POTATO_SEED") {
            text = `🥔 Potato (${inventory.POTATO_SEED})`;
        }

        if (item === "BIRCH_SEED") {
            text = `🌳 Birch (${inventory.BIRCH_SEED})`;
        }

        if (item === "PINE_SEED") {
            text = `🌲 Pine (${inventory.PINE_SEED})`;
        }

        if (item === "OAK_SEED") {
            text = `🌳 Oak (${inventory.OAK_SEED})`;
        }

        if (item === "PICK_STONE") {
            text = `🪨 Stone`;
        }

        if (item === "PICK_IRON") {
            text = `⛏ Iron`;
        }

        if (item === "PICK_COPPER") {
            text = `🟠 Copper`;
        }

        div.textContent = text;

        el.appendChild(div);
    });
}
/* ================= INPUT ================= */

document.addEventListener("keydown", (e) => {

    // HOTBAR (НИЧЕГО НЕ УДАЛЯЕТ)
    if (e.key === "1") selectedSlot = "WHEAT_SEED";
    if (e.key === "2") selectedSlot = "CARROT_SEED";
    if (e.key === "3") selectedSlot = "POTATO_SEED";

    if (e.key === "4") selectedSlot = "BIRCH_SEED";
    if (e.key === "5") selectedSlot = "PINE_SEED";
    if (e.key === "6") selectedSlot = "OAK_SEED";

    if (e.key === "7") selectedSlot = "PICK_STONE";
    if (e.key === "8") selectedSlot = "PICK_IRON";
    if (e.key === "9") selectedSlot = "PICK_COPPER";

    // BIOMES (ТОЛЬКО ЭТО ПЕРЕРИСОВЫВАЕТ МИР)
    if (e.key === "f") {
        currentBiome = BIOMES.FARM;
        generateWorld();
        initPlots();
    }

    if (e.key === "g") {
        currentBiome = BIOMES.WOOD;
        generateWorld();
        initPlots();
    }

    if (e.key === "h") {
        currentBiome = BIOMES.MINE;
        generateWorld();
        initPlots();
    }

    renderInventory();
});
/* ================= START ================= */

window.addEventListener("load", () => {

    generateWorld();
    initPlots();

    loadWorld(); // 👈 ДОБАВИТЬ ЭТО

    renderInventory();
    initShop();
});
    
/* ================= SAFETY FIX ================= */

function safeGet(id) {
    return document.getElementById(id);
}

const oldAppend = island.appendChild;

island.appendChild = function (el) {
    console.log("APPEND:", el);
    return oldAppend.call(island, el);
};
    function saveWorld() {
    const data = [];

    for (const cell of plots.values()) {
        data.push({
            x: cell.x,
            y: cell.y,
            stage: cell.stage,
            type: cell.type
        });
    }

    localStorage.setItem("farm_world", JSON.stringify(data));
}

    
    function loadWorld() {
    const data = JSON.parse(localStorage.getItem("farm_world"));
    if (!data) return;

    for (const saved of data) {

        const cell = Array.from(plots.values())
            .find(p => p.x === saved.x && p.y === saved.y);

        if (!cell) continue;

        cell.stage = saved.stage;
        cell.type = saved.type;

        if (cell.plantEl) {
            cell.plantEl.remove();
        }

        if (saved.stage >= 0 && saved.type) {
            const plant = createPlantVisual(
                cell.x,
                cell.y,
                cell.stage,
                cell.type
            );

            island.appendChild(plant);
            cell.plantEl = plant;
        }
    }
}
</script>
</body>
</html>
