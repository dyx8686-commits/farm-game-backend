<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;

    background: #4fc3f7;

    overflow: hidden;
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

.island {
    width: 900px;
    height: 500px;

    margin: 0 auto;

    border-radius: 40px;
    position: relative;

    border: 8px solid #4e8f35;
    background: #6dbf4b;

    z-index: 2;
}

/* OBJECTS */
.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}

.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
}

/* FIELD */
.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* INVENTORY */


/* GRID */
.inventory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

/* SLOT */
.inv-item {
    width: 65px;
    height: 65px;
    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 6px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    font-size: 14px;
    color: white;

    position: relative;
}

/* HOVER */
.inv-item:hover {
    background: #999;
}

/* SELECTED */
.selected {
    border: 3px solid yellow !important;
}
/* ===== SHOP GRID ===== */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.shop-item {

    background: #8b8b8b;
    border: 3px solid #555;
    border-radius: 8px;

    padding: 10px;

    text-align: center;

    cursor: pointer;

    color: white;

    transition: 0.2s;
}

.shop-item:hover {
    background: #999;
    transform: scale(1.03);
}

.shop-icon {
    font-size: 32px;
}

.shop-price {
    margin-top: 5px;
    font-size: 13px;
    color: gold;
}

/* ITEM COUNT */
.inv-count {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 12px;
    color: white;
    font-weight: bold;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* WORLD OBJECTS */
.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }
    body.farm {
    background: linear-gradient(#87CEEB, #4CAF50);
}

body.wood {
    background: linear-gradient(#1f3d1f, #0f1f0f);
}

body.mine {
    background: linear-gradient(#666, #222);
}
    .world {
    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #4fc3f7;

    display: flex;
    justify-content: center;
    align-items: center;
}
    .grid-overlay {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(10, 1fr);

    z-index: 1;
    pointer-events: none;
}

.grid-cell {
    width: 100%;
    height: 100%;
}

.grid-cell:nth-child(odd) {
    background: rgba(255,255,255,0.08);
}

.grid-cell:nth-child(even) {
    background: rgba(0,0,0,0.05);
}
    #plots {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);

    z-index: 5;
}

.plot {
    position: absolute;

    width: 60px;
    height: 60px;

    background: rgba(80,40,0,0.45);
    border: 2px solid rgba(255,255,255,0.4);

    box-sizing: border-box;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    font-size: 12px;

    z-index: 6;
}

</style>
</head>

<body id="gameBody">

<div class="world">
    
    <div class="game">

<div id="island" class="island">
    
   
    <!-- UI BUTTONS -->
     <div style="position: absolute; top: 70px; left: 10px; z-index: 10;">
    <button onclick="openInventory()">🎒 Inventory</button>
</div>

    <div class="grid-overlay" id="grid"></div>
    <div id="plots"></div>

    


    <div id="farmerObjects">

        <div class="shop" onclick="openShop()"></div>

        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>

    </div>
  </div>
</div> <!-- island -->
</div> <!-- game -->




<script src="/js/core.js"></script>

<script src="/js/world_farm.js"></script>
<script src="/js/world_wood.js"></script>
<script src="/js/world_mine.js"></script>

<script src="/js/inventory.js"></script>
<script src="/js/shop.js"></script>

    <!-- INVENTORY MODAL -->
<div id="inventoryModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:1000;
">

    <div style="
    width:420px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:12px;
    ">

        <h3>🎒 Inventory</h3>

        <div id="inventoryContent"></div>

        <br>

        <button onclick="closeInventory()">Close</button>

    </div>
</div>
    <!-- SHOP 2.0 MODAL -->
<div id="shopModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:1000;
">

    <div style="
    width:520px;
    margin:80px auto;
    background:#2c2c2c;
    padding:15px;
    border-radius:14px;
    color:white;
    ">

        <!-- HEADER -->
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>🛒 SHOP</h3>
            <button onclick="closeShop()">✖</button>
        </div>

        <!-- TABS -->
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="showShopTab('buy')">BUY</button>
            <button onclick="showShopTab('sell')">SELL</button>
        </div>

        <!-- CONTENT -->
        <div id="shopContent" style="margin-top:15px;"></div>

    </div>
</div>
    
</body>
</html>
