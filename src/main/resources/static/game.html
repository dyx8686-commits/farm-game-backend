<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#87CEEB, #4CAF50);
}

h1 {
    text-align: center;
    color: white;
    padding-top: 10px;
}

.game {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.island {
    width: 900px;
    height: 500px;
    border-radius: 40px;
    position: relative;
    border: 8px solid #4e8f35;
    background: #6dbf4b;
}

/* OBJECTS */
.farm, .shop {
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
}



.shop {
    top: 220px;
    left: 200px;
    width: 90px;
    height: 90px;
    background: #ffcc00;
    border-radius: 12px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    border-radius: 6px;
    left: 420px;
    top: 260px;
}

/* FIELD */
.field {
    width: 40px;
    height: 40px;
    position: absolute;
    border-radius: 6px;
}

/* INVENTORY */
.inventory {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 180px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.inv-item {
    padding: 5px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.selected {
    background: #c8f7c5 !important;
}

/* WORLD OBJECTS */
.plantObj, .treeObj, .stoneObj {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 6px;
}

.plantObj { background: #3CB371; }
.treeObj { background: #2e8b57; }
.stoneObj { background: #666; }

</style>
</head>

<body>

<h1>🌴 Farm Game</h1>

<div class="game">

<div id="island" class="island">

    <div class="panel">
        <div id="info">Loading...</div>

       
    </div>

    <div class="inventory" id="inventory"></div>

    <div id="farmerObjects">

        
        <div class="shop" onclick="openShop()"></div>

        
        <div id="player"></div>

        <div id="farmerPlants"></div>
        <div id="woodTrees"></div>
        <div id="minerStones"></div>

    </div>

</div>

</div>
    <!-- SHOP -->

<div id="shopModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
">

    <div style="
    width:400px;
    background:white;
    margin:100px auto;
    padding:20px;
    border-radius:12px;
    ">

        <div id="shopContent"></div>

        <button onclick="closeShop()">
            Close
        </button>

    </div>

</div>

<script>

const BASE = "https://farm-game-backend-eo4y.onrender.com";
let playerName = new URLSearchParams(window.location.search).get("name");

let selectedItem = null;

// ================= LOAD =================

async function load() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    const r = player.resources || {};

    document.getElementById("info").innerHTML = `
        <b>${player.name}</b><br>
        CLASS: ${player.type}<br><br>

        FOOD: ${r.FOOD ?? 0}<br>
        WOOD: ${r.WOOD ?? 0}<br>
        ORE: ${r.ORE ?? 0}<br>
        GOLD: ${r.GOLD ?? 0}<br>
        SEEDS: ${player.seeds ?? 0}
    `;

    renderInventory(r);
    renderWorld(player);
    updatePlayer();
}

// ================= WORLD =================

function renderWorld(player) {

    document.getElementById("farmerPlants").innerHTML = "";
    document.getElementById("woodTrees").innerHTML = "";
    document.getElementById("minerStones").innerHTML = "";

    if (player.type === "FARMER") {
        renderPlants(player);
    }

    if (player.type === "WOODCUTTER") {
        renderTrees(player);
    }

    if (player.type === "MINER") {
        renderStones(player);
    }
}
function clearWorld() {
    document.getElementById("farmerPlants").innerHTML = "";
    document.getElementById("woodTrees").innerHTML = "";
    document.getElementById("minerStones").innerHTML = "";
}

// 🌱 FARMER
function renderPlants(player) {

    const c = document.getElementById("farmerPlants");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "field";

        d.style.left = (240 + (i % 3) * 70) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 70) + "px";

        d.style.background = "#8B5A2B";
        d.style.border = "2px solid #5c3b15";

        d.onclick = async () => {

            if (selectedItem !== "SEEDS") {
                alert("Select SEEDS in inventory");
                return;
            }

            await fetch(BASE + "/game/plant?name=" + playerName);

            load();
        };

        c.appendChild(d);
    }
}

// 🌲 WOODCUTTER
function renderTrees() {

    const c = document.getElementById("woodTrees");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "treeObj";

        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (140 + Math.floor(i / 3) * 100) + "px";

        d.onclick = async () => {

            await fetch(BASE + "/game/wood?name=" + playerName, {
                method:"POST"
            });

            load();
        };

        c.appendChild(d);
    }
}


// ⛏ MINER
function renderStones() {

    const c = document.getElementById("minerStones");
    c.innerHTML = "";

    for (let i = 0; i < 6; i++) {

        const d = document.createElement("div");

        d.className = "stoneObj";

        d.style.left = (180 + (i % 3) * 90) + "px";
        d.style.top = (180 + Math.floor(i / 3) * 90) + "px";

        d.onclick = async () => {

            await fetch(BASE + "/game/mine?name=" + playerName, {
                method:"POST"
            });

            load();
        };

        c.appendChild(d);
    }
}

// ================= PLAYER =================

function updatePlayer() {
    const p = document.getElementById("player");
    p.style.left = "420px";
    p.style.top = "260px";
}

// ================= INVENTORY =================

function renderInventory(r) {

    const inv = document.getElementById("inventory");

    const items = [
        {name:"FOOD", icon:"🍞"},
        {name:"WOOD", icon:"🪵"},
        {name:"ORE", icon:"⛏"},
        {name:"GOLD", icon:"💰"},
        {name:"SEEDS", icon:"🌾"}
    ];

    inv.innerHTML = "";

    items.forEach(i => {

        const d = document.createElement("div");
        d.className = "inv-item";

        if (selectedItem === i.name) d.classList.add("selected");

        d.innerHTML = `${i.icon} ${i.name}: ${r[i.name] ?? 0}`;

        d.onclick = () => {
            selectedItem = i.name === selectedItem ? null : i.name;
            load();
        };

        inv.appendChild(d);
    });
}

// ================= ACTIONS =================



// ================= ACTIONS =================

async function harvest() {
    await fetch(BASE + "/game/harvest?name=" + playerName);
    load();
}

// ===== SHOP =====

async function openShop() {

    const res = await fetch(BASE + "/game/players");
    const players = await res.json();

    const player = players.find(p => p.name === playerName);
    if (!player) return;

    let shopItems = [];

    if (player.type === "FARMER") {
        shopItems = [
            { name: "SEEDS", action: "buySeeds()" }
        ];
    }

    if (player.type === "WOODCUTTER") {
        shopItems = [
            { name: "SAPLING", action: "buySapling()" }
        ];
    }

    if (player.type === "MINER") {
        shopItems = [
            { name: "PICKAXE", action: "buyPickaxe()" }
        ];
    }

    const content = document.getElementById("shopContent");

    content.innerHTML = shopItems.map(i => `
        <button onclick="${i.action}">
            Buy ${i.name}
        </button>
    `).join("");

    document.getElementById("shopModal").style.display = "block";
}

function closeShop() {
    document.getElementById("shopModal").style.display = "none";
}

// ===== BUY FUNCTIONS (ОДИН ВАРИАНТ КАЖДОЙ) =====

async function buySeeds() {
    await fetch(BASE + "/game/shop/seeds?name=" + playerName, { method: "POST" });
    load();
}

function buySapling() {
    alert("Saplings coming soon");
}

function buyPickaxe() {
    alert("Pickaxes coming soon");
}

// ================= LOOP =================

setInterval(load, 3000);
load();

</script>

</body>
</html>
