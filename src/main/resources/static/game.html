<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4fc3f7;
}

#island {
    width: 900px;
    height: 500px;

    margin: 60px auto;

    position: relative;

    border: 6px solid #3e7d2f;
    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),
        #6dbf4b;

    background-size: 60px 60px;
}

/* ГРЯДКА */
.plot {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(139, 69, 19, 0.9);
    border: 2px solid rgba(0,0,0,0.3);
    box-sizing: border-box;
}
    #inventory {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
}

.slot {
    width: 70px;
    height: 70px;

    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    font-family: Arial;
}

.slot.selected {
    border: 2px solid yellow;
}

.slot-count {
    font-size: 12px;
}
</style>
</head>

<body>
<div id="shopWindow" style="
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:300px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:15px;
    border-radius:10px;
    display:none;
    z-index:999;
">

    <h3>🏪 Shop</h3>

    <button id="buySeedBtn">Buy Seed (3💰)</button>
    <button id="sellBtn">Sell Wheat (5💰)</button>

    <br><br>
    <button onclick="toggleShop()">Close</button>

    <div id="shopInfo"></div>

</div>

    <div id="island"></div>
<div id="inventory"></div>
    
<script>

/* ================= BIOMES ================= */

const BIOMES = {
    FARM: "FARM",
    WOOD: "WOOD",
    MINE: "MINE"
};

let currentBiome = BIOMES.FARM;

/* ================= INVENTORY ================= */

const inventory = {

    /* FARM */

    WHEAT_SEED: 5,
CARROT_SEED: 5,
POTATO_SEED: 5,

WHEAT: 0,
CARROT: 0,
POTATO: 0,

    /* WOOD */

    BIRCH_SEED: 3,
    PINE_SEED: 3,
    OAK_SEED: 3,

    BIRCH_WOOD: 0,
    PINE_WOOD: 0,
    OAK_WOOD: 0,

    /* MINE */

    STONE: 0,
    IRON: 0,
    COPPER: 0,

    /* MONEY */

    GOLD: 20
};

let selectedSlot = "WHEAT_SEED";

/* ================= WORLD ================= */

const island = document.getElementById("island");
const GRID_SIZE = 60;

const MAX_PLOTS = 6;
const plots = new Map();

function initPlots() {

    const positions = [
        {x: 0, y: 0},
        {x: 1, y: 0},
        {x: 2, y: 0},
        {x: 0, y: 1},
        {x: 1, y: 1},
        {x: 2, y: 1}
    ];

    positions.forEach((p, i) => {

        const x = p.x * GRID_SIZE;
        const y = p.y * GRID_SIZE;

        const plotEl = document.createElement("div");
        plotEl.className = "plot";
        plotEl.style.left = x + "px";
        plotEl.style.top = y + "px";

        island.appendChild(plotEl);

        plots.set(i, {
            x,
            y,
            plantEl: null,
            stage: -1,
            type: null
        });
    });
}

/* ================= SHOP ================= */
function initShop() {

    const buyBtn = document.getElementById("buySeedBtn");
    const sellBtn = document.getElementById("sellBtn");

    if (buyBtn) {
        buyBtn.addEventListener("click", () => {

            if (inventory.GOLD < 3) return;

            inventory.GOLD -= 3;
            inventory.WHEAT_SEED += 1;

            renderInventory();
        });
    }

    if (sellBtn) {
        sellBtn.addEventListener("click", () => {

            if (inventory.WHEAT <= 0) return;

            inventory.WHEAT -= 1;
            inventory.GOLD += 5;

            renderInventory();
        });
    }
}
    console.log("SHOP INIT");
function toggleShop() {
    const el = document.getElementById("shopWindow");
    if (!el) return;

    el.style.display = el.style.display === "block" ? "none" : "block";
}

/* ================= BUILDINGS ================= */

function createShopBuilding(x, y) {

    const shop = document.createElement("div");

    shop.style.position = "absolute";
    shop.style.left = x + "px";
    shop.style.top = y + "px";

    shop.style.width = "60px";
    shop.style.height = "60px";

    shop.style.display = "flex";
    shop.style.alignItems = "center";
    shop.style.justifyContent = "center";

    shop.style.fontSize = "42px";
    shop.style.cursor = "pointer";

    shop.innerHTML = "🏪";

    shop.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleShop();
    });

    island.appendChild(shop);
}

/* ================= WORLD GENERATION ================= */

function generateWorld() {

    island.innerHTML = "";
    plots.clear();

    createShopBuilding(400, 220);

    if (
    currentBiome !== BIOMES.FARM &&
    currentBiome !== BIOMES.WOOD &&
    currentBiome !== BIOMES.MINE
) return;

    if (currentBiome === BIOMES.WOOD) {
        console.log("WOOD BIOME");
    }

    if (currentBiome === BIOMES.MINE) {
        console.log("MINE BIOME");
    }
}

/* ================= PLANTS ================= */

function createPlantVisual(x, y, stage, type) {

    const el = document.createElement("div");

    el.style.position = "absolute";
    el.style.width = "28px";
    el.style.height = "28px";
    el.style.borderRadius = "50%";

    el.style.left = (x + 16) + "px";
    el.style.top = (y + 16) + "px";
    el.style.zIndex = "10";

    /* FARM PLANTS */
    if (type === "WHEAT") {
        if (stage === 0) el.style.background = "#2ecc71";
        if (stage === 1) el.style.background = "#27ae60";
        if (stage === 2) el.style.background = "#145a32";
    }

  
    /* WOOD PLANTS */

if (type === "BIRCH") {
    if (stage === 0) el.style.background = "#d7ccc8";
    if (stage === 1) el.style.background = "#a1887f";
    if (stage === 2) el.style.background = "#6d4c41";
}

if (type === "PINE") {
    if (stage === 0) el.style.background = "#81c784";
    if (stage === 1) el.style.background = "#388e3c";
    if (stage === 2) el.style.background = "#1b5e20";
}

if (type === "OAK") {
    if (stage === 0) el.style.background = "#a1887f";
    if (stage === 1) el.style.background = "#6d4c41";
    if (stage === 2) el.style.background = "#3e2723";
}

/* ================= CLICK SYSTEM ================= */

island.addEventListener("click", (e) => {

    const rect = island.getBoundingClientRect();

    const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
    const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

    let target = null;

    for (const cell of plots.values()) {
        if (cell.x === x && cell.y === y) {
            target = cell;
            break;
        }
    }

    if (!target) return;

    /* PLANT */
    if (target.stage === -1) {

        const seed = selectedSlot;

        const isFarm = seed.includes("WHEAT") || seed.includes("CARROT") || seed.includes("POTATO");
const isWood = seed.includes("BIRCH") || seed.includes("PINE") || seed.includes("OAK");

if (currentBiome === BIOMES.FARM && !isFarm) return;
if (currentBiome === BIOMES.WOOD && !isWood) return;
        if (inventory[seed] <= 0) return;

        inventory[seed]--;

        const type = seed.replace("_SEED", "");

        const plant = createPlantVisual(x, y, 0, type);

        island.appendChild(plant);

        target.plantEl = plant;
        target.stage = 0;
        target.type = type;

        startGrowth(`${x}:${y}`);

        renderInventory();
        return;
    }

    /* HARVEST */
    if (target.stage === 2) {

        const type = target.type;

        if (type === "WHEAT") inventory.WHEAT++;
        if (type === "BIRCH") inventory.BIRCH_WOOD++;
if (type === "PINE") inventory.PINE_WOOD++;
if (type === "OAK") inventory.OAK_WOOD++;

        target.plantEl.remove();

        target.plantEl = null;
        target.stage = -1;
        target.type = null;

        renderInventory();
    }
});

/* ================= GROWTH ================= */

function startGrowth(key) {
    setTimeout(() => growStep(key), 3000);
}

function growStep(key) {

    const cell = plots.get(key);
    if (!cell || !cell.plantEl) return;

    cell.stage++;

    const x = parseInt(key.split(":")[0]);
    const y = parseInt(key.split(":")[1]);

    const newPlant = createPlantVisual(x, y, cell.stage, cell.type);

    cell.plantEl.remove();
    cell.plantEl = newPlant;

    island.appendChild(newPlant);

    if (cell.stage < 2) {
        setTimeout(() => growStep(key), 3000);
    }
}

/* ================= INVENTORY ================= */

function renderInventory() {

    const el = document.getElementById("inventory");
    if (!el) return;

    el.innerHTML = `
        <!-- FARM -->
        <div class="slot ${selectedSlot === 'WHEAT_SEED' ? 'selected' : ''}">
            🌾 Wheat Seed (${inventory.WHEAT_SEED})
        </div>

        <div class="slot ${selectedSlot === 'CARROT_SEED' ? 'selected' : ''}">
            🥕 Carrot Seed (${inventory.CARROT_SEED})
        </div>

        <div class="slot ${selectedSlot === 'POTATO_SEED' ? 'selected' : ''}">
            🥔 Potato Seed (${inventory.POTATO_SEED})
        </div>

        <!-- WOOD -->
        <div class="slot ${selectedSlot === 'BIRCH_SEED' ? 'selected' : ''}">
            🌳 Birch Seed (${inventory.BIRCH_SEED})
        </div>

        <div class="slot ${selectedSlot === 'PINE_SEED' ? 'selected' : ''}">
            🌲 Pine Seed (${inventory.PINE_SEED})
        </div>

        <div class="slot ${selectedSlot === 'OAK_SEED' ? 'selected' : ''}">
            🌳 Oak Seed (${inventory.OAK_SEED})
        </div>

        <!-- MINE -->
        <div class="slot ${selectedSlot === 'PICK_STONE' ? 'selected' : ''}">
            🪨 Stone Pick
        </div>

        <div class="slot ${selectedSlot === 'PICK_IRON' ? 'selected' : ''}">
            ⛏ Iron Pick
        </div>

        <div class="slot ${selectedSlot === 'PICK_COPPER' ? 'selected' : ''}">
            🟠 Copper Pick
        </div>

        <!-- RESOURCES -->
        <div class="slot">
            🌾 ${inventory.WHEAT}
        </div>

        <div class="slot">
            🥕 ${inventory.CARROT}
        </div>

        <div class="slot">
            🥔 ${inventory.POTATO}
        </div>

        <div class="slot">
            🪵 Wood
        </div>

        <div class="slot">
            🪨 Stone
        </div>

        <div class="slot">
            ⛓ Iron
        </div>

        <div class="slot">
            🟠 Copper
        </div>

        <div class="slot">
            💰 ${inventory.GOLD}
        </div>
    `;
}




/* ================= INPUT ================= */

document.addEventListener("keydown", (e) => {


    // FARM
    if (e.key === "1") selectedSlot = "WHEAT_SEED";
    if (e.key === "2") selectedSlot = "CARROT_SEED";
    if (e.key === "3") selectedSlot = "POTATO_SEED";

    // WOOD
    if (e.key === "4") selectedSlot = "BIRCH_SEED";
    if (e.key === "5") selectedSlot = "PINE_SEED";
    if (e.key === "6") selectedSlot = "OAK_SEED";

    // MINE
    if (e.key === "7") selectedSlot = "PICK_STONE";
    if (e.key === "8") selectedSlot = "PICK_IRON";
    if (e.key === "9") selectedSlot = "PICK_COPPER";

    /* BIOMES */
    if (e.key === "f") currentBiome = BIOMES.FARM;
    if (e.key === "g") currentBiome = BIOMES.WOOD;
    if (e.key === "h") currentBiome = BIOMES.MINE;

    generateWorld();
    renderInventory();
});

/* ================= START ================= */

window.addEventListener("load", () => {

    generateWorld();   // рисуем базу мира

    initPlots();       // добавляем 6 фиксированных клеток

    renderInventory(); // UI

    initShop();        // магазин
});
    
/* ================= SAFETY FIX ================= */

function safeGet(id) {
    return document.getElementById(id);
}


</script>
</body>
</html>
